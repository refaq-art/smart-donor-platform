<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الجمعية الذكية</title>
<style>
:root{--brand:#0f766e;--dark:#102522;--gold:#b8892d;--bg:#f7f2e9;--card:#fffaf1;--line:#e4dac8;--text:#142b27;--muted:#66746f;--red:#b42318;--green:#087443;--blue:#175cd3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e9fff8,#f7f2e9);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--text)}button,input,textarea,select{font:inherit}button,a.btn{border:0;background:var(--brand);color:#fff;border-radius:14px;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}.secondary{background:#fff!important;color:var(--text)!important;border:1px solid var(--line)!important}.danger{background:var(--red)!important}.goldbtn{background:var(--gold)!important}.layout{display:grid;grid-template-columns:285px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#0d2a26,#102522);color:white;padding:22px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}.logo{width:50px;height:50px;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--gold));display:grid;place-items:center;font-size:24px;font-weight:900}.brand h1{font-size:18px;margin:0}.brand p{font-size:13px;color:#bdd3cf;margin:4px 0 0}.nav{display:grid;gap:8px}.nav button{width:100%;text-align:right;justify-content:flex-start;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}.nav button.active,.nav button:hover{background:rgba(255,255,255,.16)}.note{margin-top:16px;background:rgba(255,255,255,.08);border-radius:16px;padding:13px;color:#d8ebe7;line-height:1.8;font-size:13px}.main{padding:22px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:16px}.title h2{font-size:30px;margin:0}.title p{color:var(--muted);margin:6px 0 0}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.1fr .9fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:rgba(255,250,241,.97);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:0 14px 36px rgba(14,37,34,.08)}.white{background:#fff}.hero{background:linear-gradient(135deg,#102522,#0f766e);color:#fff;border-radius:28px;padding:24px;margin-bottom:16px}.hero p{color:#dff4ef;line-height:1.8}.stat span{color:var(--muted);font-weight:700}.stat b{display:block;color:var(--brand);font-size:28px;margin-top:7px}.pill{display:inline-flex;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;background:#e7f5f2;color:var(--brand);margin:3px}.red{background:#fee4e2;color:var(--red)}.green{background:#e7f8ef;color:var(--green)}.gold{background:#fff1d6;color:#8a5b00}.blue{background:#e8f1ff;color:var(--blue)}.small{font-size:13px;color:var(--muted);line-height:1.8}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.table{overflow:auto;border-radius:18px;border:1px solid var(--line);background:#fff}table{width:100%;border-collapse:collapse;min-width:780px}th,td{border-bottom:1px solid var(--line);padding:12px;text-align:right;vertical-align:top}th{background:#fffcf6;color:var(--muted);font-size:13px}label{font-size:14px;font-weight:800;display:block;margin-top:10px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px;background:#fff;margin-top:5px}textarea{min-height:90px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(2,18,16,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.show{display:flex}.box{background:var(--bg);border-radius:24px;padding:18px;width:min(880px,96vw);max-height:92vh;overflow:auto}.mobile{display:none}.toast{position:fixed;left:18px;bottom:18px;background:#102522;color:white;padding:13px 16px;border-radius:14px;display:none;z-index:30}.toast.show{display:block}.empty{border:1px dashed var(--line);padding:25px;border-radius:18px;text-align:center;color:var(--muted);background:#fff}.progress{height:9px;background:#eee3d0;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#22b3a1)}@media(max-width:900px){.layout{display:block}.side{display:none;height:auto;position:relative}.side.open{display:block}.main{padding:14px}.cards,.two,.three,.form{grid-template-columns:1fr}.mobile{display:inline-flex;margin-bottom:10px}table{min-width:700px}.top{display:block}.title h2{font-size:25px}}
</style>
</head>
<body>
<div id="app"></div><div id="modal" class="modal"></div><div id="toast" class="toast"></div>
<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getAuth,onAuthStateChanged,signOut } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import { getFirestore,doc,getDoc,setDoc,collection,addDoc,getDocs,updateDoc,deleteDoc,serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
const cfg=window.FIREBASE_CONFIG; const fb=initializeApp(cfg); const auth=getAuth(fb); const db=getFirestore(fb);
let user=null, org={}, page='home'; const data={projects:[],donors:[],supports:[],opportunities:[],tasks:[],letters:[],impactReports:[]};
const $=s=>document.querySelector(s), money=n=>(Number(n)||0).toLocaleString('ar-SA')+' ر.س', uid=()=>Math.random().toString(36).slice(2), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cols={projects:'projects',donors:'donors',supports:'supports',opportunities:'opportunities',tasks:'tasks',letters:'letters',impactReports:'impactReports'};
function path(c){return collection(db,'organizations',user.uid,c)}
async function load(){const os=await getDoc(doc(db,'organizations',user.uid)); org=os.exists()?os.data():{org:'جمعية بدون اسم',email:user.email}; for(const k of Object.keys(cols)){const s=await getDocs(path(k));data[k]=s.docs.map(d=>({id:d.id,...d.data()}));} seedTasks(); render();}
function seedTasks(){const existing=new Set(data.tasks.map(t=>t.title)); const adds=[]; data.opportunities.filter(o=>o.status!=='مغلقة').forEach(o=>adds.push('مراجعة فرصة: '+(o.title||o.name))); data.supports.filter(s=>!s.impactDone).forEach(s=>adds.push('إعداد تقرير أثر للداعم: '+(s.donor||''))); data.projects.forEach(p=>{let rem=Number(p.amount||0)-Number(p.covered||0); if(rem>0) adds.push('تغطية فجوة '+money(rem)+' لمشروع '+p.name)}); adds.filter(x=>x&&!existing.has(x)).slice(0,5).forEach(x=>data.tasks.push({id:'local-'+uid(),title:x,status:'جديدة',priority:'عالية',local:true}));}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
onAuthStateChanged(auth,async u=>{if(!u){location.href='login-firebase.html?v=6';return} user=u; await load();});
function layout(){return `<div class="layout"><aside id="side" class="side"><div class="brand"><div class="logo">ذ</div><div><h1>لوحة الجمعية الذكية</h1><p>${esc(org.org||org.email||'')}</p></div></div><div class="nav">${nav('home','الرئيسية')}${nav('projects','المشاريع')}${nav('donors','الداعمين')}${nav('supports','الدعومات السابقة')}${nav('opportunities','الفرص المفتوحة')}${nav('tasks','المهام والمتابعة')}${nav('ai','مركز الذكاء الاصطناعي')}${nav('letters','الخطابات')}${nav('impactReports','تقارير الأثر')}${nav('portfolio','محفظة المشاريع')}${nav('settings','الإعدادات')}</div><div class="note">كل البيانات هنا محفوظة في Firestore داخل حساب جمعيتك فقط. هذه هي النسخة العملية متعددة الجمعيات.</div></aside><main class="main"><button class="mobile secondary" onclick="document.getElementById('side').classList.toggle('open')">☰ القائمة</button><div class="top"><div class="title"><h2 id="ttl"></h2><p id="sub"></p></div><div class="actions"><a class="btn secondary" href="./">الواجهة العامة</a><button class="danger" id="logout">خروج</button></div></div><section id="content"></section></main></div>`}
function nav(id,t){return `<button class="${page===id?'active':''}" data-page="${id}">${t}</button>`}
function render(){if(!user)return; $('#app').innerHTML=layout(); document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()}); $('#logout').onclick=()=>signOut(auth); ({home,projects,donors,supports,opportunities,tasks,ai,letters,impactReports,portfolio,settings}[page]||home)();}
function title(t,s=''){$('#ttl').textContent=t;$('#sub').textContent=s}
function home(){title('الرئيسية','ملخص تنفيذي حي من بيانات الجمعية'); const total=data.projects.reduce((a,p)=>a+Number(p.amount||0),0), covered=data.projects.reduce((a,p)=>a+Number(p.covered||0),0), sup=data.supports.reduce((a,s)=>a+Number(s.amount||0),0); $('#content').innerHTML=`<div class="hero"><h3>صباح الخير، ${esc(org.org||'')}</h3><p>هذه لوحة تنمية الموارد الذكية: تجمع المشاريع، الداعمين، الدعومات، الفرص، المهام، الخطابات، وتقارير الأثر في مكان واحد.</p><div class="actions"><button onclick="openForm('projects')">إضافة مشروع</button><button onclick="openForm('donors')">إضافة داعم</button><button onclick="openForm('opportunities')">إضافة فرصة</button><button onclick="page='ai';render()">تشغيل الذكاء</button></div></div><div class="grid cards"><div class="card stat"><span>المشاريع</span><b>${data.projects.length}</b></div><div class="card stat"><span>الداعمين</span><b>${data.donors.length}</b></div><div class="card stat"><span>الدعم السابق</span><b>${money(sup)}</b></div><div class="card stat"><span>الفجوة</span><b>${money(total-covered)}</b></div></div><br><div class="grid two"><div class="card white"><h3>ماذا أفعل اليوم؟</h3>${recommendations().slice(0,7).map(x=>`<p><span class="pill red">مهم</span> ${esc(x)}</p>`).join('')||'<div class="empty">لا توجد توصيات بعد. أضف مشاريع وداعمين.</div>'}</div><div class="card white"><h3>أقوى فرص مناسبة</h3>${data.opportunities.slice(0,5).map(o=>`<p><b>${esc(o.title||o.name)}</b><br><span class="small">${esc(o.sector||'عام')} — ${matchOpportunity(o).score}% — ${esc(matchOpportunity(o).project?.name||'لا يوجد مشروع')}</span></p>`).join('')||'<div class="empty">لا توجد فرص محفوظة</div>'}</div></div>`}
function tablePage(key,heading,sub){title(heading,sub); $('#content').innerHTML=`<div class="actions"><button onclick="openForm('${key}')">إضافة</button>${key==='opportunities'?'<button class="secondary" onclick="importRadar()">استيراد من الرادار التلقائي</button>':''}</div><br>${renderTable(key)}`}
function projects(){tablePage('projects','المشاريع','إدارة مشاريع الجمعية واحتياجاتها')}
function donors(){tablePage('donors','الداعمين','CRM علاقات الداعمين')}
function supports(){tablePage('supports','الدعومات السابقة','ذاكرة الدعم والأثر')}
function opportunities(){tablePage('opportunities','الفرص المفتوحة','فرص الدعم المرصودة والمعتمدة')}
function tasks(){tablePage('tasks','المهام والمتابعة','متابعة يومية تلقائية ويدوية')}
function letters(){tablePage('letters','الخطابات','خطابات محفوظة ومولدة')}
function impactReports(){tablePage('impactReports','تقارير الأثر','تقارير أثر محفوظة لكل داعم')}
function renderTable(key){const rows=data[key]; if(!rows.length)return'<div class="empty">لا توجد بيانات بعد</div>'; const cols=columns(key); return `<div class="table"><table><tr>${cols.map(c=>`<th>${c.t}</th>`).join('')}<th>إجراء</th></tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(c.f(r))}</td>`).join('')}<td><button class="secondary" onclick="openForm('${key}','${r.id}')">تعديل</button> <button class="danger" onclick="removeItem('${key}','${r.id}')">حذف</button></td></tr>`).join('')}</table></div>`}
function columns(k){return {projects:[{t:'المشروع',f:r=>r.name},{t:'المجال',f:r=>r.sector},{t:'المبلغ',f:r=>money(r.amount)},{t:'المتبقي',f:r=>money((r.amount||0)-(r.covered||0))},{t:'المستفيدين',f:r=>r.beneficiaries}],donors:[{t:'الجهة',f:r=>r.name},{t:'النوع',f:r=>r.type},{t:'المجال',f:r=>r.sector},{t:'المسؤول',f:r=>r.contact},{t:'درجة العلاقة',f:r=>donorHeat(r)}],supports:[{t:'الداعم',f:r=>r.donor},{t:'المشروع',f:r=>r.project},{t:'المبلغ',f:r=>money(r.amount)},{t:'التاريخ',f:r=>r.date},{t:'الأثر',f:r=>r.impactDone?'تم':'مطلوب'}],opportunities:[{t:'الفرصة',f:r=>r.title},{t:'الجهة',f:r=>r.name},{t:'المجال',f:r=>r.sector},{t:'الحالة',f:r=>r.status},{t:'المطابقة',f:r=>matchOpportunity(r).score+'%'}],tasks:[{t:'المهمة',f:r=>r.title},{t:'الأولوية',f:r=>r.priority},{t:'الحالة',f:r=>r.status},{t:'الموعد',f:r=>r.dueDate}],letters:[{t:'العنوان',f:r=>r.title},{t:'الجهة',f:r=>r.donor},{t:'المشروع',f:r=>r.project},{t:'التاريخ',f:r=>r.date}],impactReports:[{t:'التقرير',f:r=>r.title},{t:'الداعم',f:r=>r.donor},{t:'المشروع',f:r=>r.project},{t:'المستفيدين',f:r=>r.beneficiaries}]}[k]||[]}
function schema(k){return {projects:[['name','اسم المشروع'],['sector','المجال'],['amount','المبلغ المطلوب','number'],['covered','المغطى','number'],['beneficiaries','عدد المستفيدين','number'],['duration','مدة التنفيذ'],['summary','وصف مختصر','textarea'],['problem','المشكلة','textarea'],['goals','الأهداف','textarea'],['outputs','المخرجات','textarea']],donors:[['name','اسم الجهة'],['type','النوع'],['sector','مجال الاهتمام'],['city','المدينة'],['contact','مسؤول التواصل'],['phone','الجوال'],['email','البريد'],['notes','ملاحظات','textarea']],supports:[['donor','الداعم'],['project','المشروع'],['amount','المبلغ','number'],['date','التاريخ','date'],['type','نوع الدعم'],['impactDone','تم تقرير الأثر؟ نعم/لا'],['notes','ملاحظات','textarea']],opportunities:[['title','عنوان الفرصة'],['name','اسم الجهة'],['sector','المجال'],['status','الحالة'],['deadline','آخر موعد','date'],['amount','نطاق الدعم'],['url','الرابط'],['summary','الملخص','textarea'],['requirements','المتطلبات','textarea']],tasks:[['title','المهمة'],['priority','الأولوية'],['status','الحالة'],['dueDate','الموعد','date'],['notes','ملاحظات','textarea']],letters:[['title','عنوان الخطاب'],['donor','الجهة'],['project','المشروع'],['date','التاريخ','date'],['body','نص الخطاب','textarea']],impactReports:[['title','عنوان التقرير'],['donor','الداعم'],['project','المشروع'],['beneficiaries','عدد المستفيدين','number'],['body','نص التقرير','textarea']]}[k]}
window.openForm=function(k,id=''){const item=data[k].find(x=>x.id===id)||{}; $('#modal').innerHTML=`<div class="box"><div class="actions" style="justify-content:space-between"><h3>${id?'تعديل':'إضافة'}</h3><button class="secondary" onclick="closeModal()">إغلاق</button></div><div class="form">${schema(k).map(f=>field(f,item[f[0]])).join('')}</div><div class="actions"><button onclick="saveItem('${k}','${id}')">حفظ</button>${k==='letters'?`<button class="goldbtn" onclick="generateLetterText()">توليد نص</button>`:''}${k==='impactReports'?`<button class="goldbtn" onclick="generateImpactText()">توليد تقرير</button>`:''}</div></div>`; $('#modal').classList.add('show')}
function field(f,v=''){const [id,l,t]=f; if(t==='textarea')return `<label class="full">${l}<textarea id="f_${id}">${esc(v)}</textarea></label>`; return `<label>${l}<input id="f_${id}" type="${t||'text'}" value="${esc(v)}"></label>`}
window.closeModal=()=>$('#modal').classList.remove('show');
window.saveItem=async function(k,id=''){const obj={updatedAt:serverTimestamp()}; schema(k).forEach(f=>{let v=$('#f_'+f[0]).value; if(f[2]==='number')v=Number(v||0); if(f[0]==='impactDone')v=String(v).includes('نعم')||String(v).toLowerCase()==='true'; obj[f[0]]=v}); if(id&& !id.startsWith('local-')){await updateDoc(doc(db,'organizations',user.uid,k,id),obj)} else {obj.createdAt=serverTimestamp(); await addDoc(path(k),obj)} closeModal(); await load(); toast('تم الحفظ')}
window.removeItem=async function(k,id){if(!confirm('حذف؟'))return; if(!id.startsWith('local-')) await deleteDoc(doc(db,'organizations',user.uid,k,id)); await load(); toast('تم الحذف')}
function donorHeat(d){const total=data.supports.filter(s=>s.donor===d.name).reduce((a,s)=>a+Number(s.amount||0),0); return total>100000?'ساخن':total>0?'دافئ':'جديد'}
function matchOpportunity(o){let best=null,score=35; data.projects.forEach(p=>{let s=35; if((o.sector||'').includes(p.sector)||String(p.sector||'').includes(o.sector||''))s+=35; if((o.summary||o.title||'').includes(p.name))s+=15; if(o.status==='مفتوحة')s+=10; if(s>score){score=s;best=p}}); return {project:best,score:Math.min(95,score)}}
function recommendations(){let a=[]; data.opportunities.forEach(o=>{let m=matchOpportunity(o); if(m.score>=65)a.push(`فرصة ${o.title||o.name} مناسبة لمشروع ${m.project?.name||''} بنسبة ${m.score}%`)}); data.supports.filter(s=>!s.impactDone).forEach(s=>a.push(`أرسل تقرير أثر إلى ${s.donor} قبل طلب دعم جديد`)); data.donors.filter(d=>donorHeat(d)==='ساخن').forEach(d=>a.push(`تابع مع الداعم الساخن: ${d.name}`)); return a}
function ai(){title('مركز الذكاء الاصطناعي','تحليل ومطابقة وتوليد محتوى بناءً على بيانات الجمعية'); $('#content').innerHTML=`<div class="grid two"><div class="card white"><h3>توصيات ذكية</h3>${recommendations().map(x=>`<p><span class="pill green">AI</span> ${esc(x)}</p>`).join('')||'<div class="empty">أضف بيانات ليظهر التحليل</div>'}</div><div class="card white"><h3>أفضل مطابقة فرصة × مشروع</h3>${data.opportunities.map(o=>{let m=matchOpportunity(o);return `<p><b>${esc(o.title)}</b><br><span class="small">المشروع: ${esc(m.project?.name||'لا يوجد')} — الملاءمة ${m.score}%</span></p>`}).join('')||'<div class="empty">لا توجد فرص</div>'}</div></div><br><div class="card white"><h3>توليد سريع</h3><div class="actions"><button onclick="quickLetter()">خطاب لأفضل فرصة</button><button onclick="quickImpact()">تقرير أثر مطلوب</button><button onclick="page='tasks';render()">عرض المهام</button></div></div>`}
window.quickLetter=function(){const o=data.opportunities[0]||{}, m=matchOpportunity(o).project||data.projects[0]||{}; openForm('letters'); setTimeout(()=>{if($('#f_title')){$('#f_title').value='خطاب طلب دعم - '+(o.name||'جهة مانحة');$('#f_donor').value=o.name||'';$('#f_project').value=m.name||'';$('#f_body').value=letterText(o.name,m.name,m.summary);}},50)}
window.quickImpact=function(){const s=data.supports.find(x=>!x.impactDone)||data.supports[0]||{}; openForm('impactReports'); setTimeout(()=>{if($('#f_title')){$('#f_title').value='تقرير أثر - '+(s.project||'مشروع');$('#f_donor').value=s.donor||'';$('#f_project').value=s.project||'';$('#f_body').value=impactText(s.donor,s.project,'');}},50)}
window.generateLetterText=function(){const donor=$('#f_donor')?.value||'الجهة المانحة', project=$('#f_project')?.value||'مشروع الجمعية'; $('#f_body').value=letterText(donor,project,'')}
window.generateImpactText=function(){const donor=$('#f_donor')?.value||'الداعم', project=$('#f_project')?.value||'المشروع'; $('#f_body').value=impactText(donor,project,$('#f_beneficiaries')?.value||'')}
function letterText(donor,project,summary=''){return `السلام عليكم ورحمة الله وبركاته\n\nسعادة/ ${donor} المحترمين\n\nتحية طيبة، وبعد:\n\nيسر ${org.org||'الجمعية'} أن تعرض عليكم فرصة دعم مشروع "${project}"، والذي يهدف إلى ${summary||'تحقيق أثر اجتماعي واضح وقابل للقياس'}.\n\nنأمل منكم دراسة فرصة الدعم، ويسعدنا تزويدكم بملف تفصيلي أو ترتيب اجتماع تعريفي.\n\nوتفضلوا بقبول خالص الشكر والتقدير.`}
function impactText(donor,project,ben=''){return `تقرير أثر مختصر\n\nالداعم: ${donor}\nالمشروع: ${project}\nعدد المستفيدين: ${ben||'-'}\n\nما تم تنفيذه:\nتم تنفيذ المشروع وفق الخطة المعتمدة وتحقيق أثر مباشر للمستفيدين.\n\nالأثر:\nساهم دعمكم في تعزيز جودة الخدمة المقدمة ورفع مستوى الاستقرار للمستفيدين.\n\nشكرًا لدعمكم وعطائكم.`}
async function importRadar(){try{const r=await fetch('opportunities.json?v='+Date.now()); const j=await r.json(); for(const o of (j.items||[]).slice(0,10)){await addDoc(path('opportunities'),{title:o.title,name:o.name,sector:o.sector,status:o.status||'تحت المراجعة',url:o.url,summary:o.summary,amount:o.amount,createdAt:serverTimestamp()})} await load(); toast('تم استيراد فرص الرادار')}catch(e){toast('تعذر الاستيراد')}} window.importRadar=importRadar;
function portfolio(){title('محفظة المشاريع','رابط وعرض مشاريع الجمعية'); $('#content').innerHTML=`<div class="hero"><h3>محفظة مشاريع ${esc(org.org||'الجمعية')}</h3><p>استخدم هذه الصفحة لعرض المشاريع للداعمين. المرحلة القادمة: رابط عام مستقل لكل جمعية.</p></div><div class="grid three">${data.projects.map(p=>`<div class="card white"><span class="pill blue">${esc(p.sector)}</span><h3>${esc(p.name)}</h3><p class="small">${esc(p.summary||'')}</p><b>${money(p.amount)}</b><div class="progress"><i style="width:${Math.min(100,Math.round((p.covered||0)/Math.max(1,p.amount||1)*100))}%"></i></div></div>`).join('')||'<div class="empty">لا توجد مشاريع</div>'}</div>`}
function settings(){title('الإعدادات','بيانات الجمعية'); $('#content').innerHTML=`<div class="card white form"><label>اسم الجمعية<input id="orgName" value="${esc(org.org||'')}"></label><label>المدينة<input id="orgCity" value="${esc(org.city||'')}"></label><label>المسؤول<input id="orgManager" value="${esc(org.manager||'')}"></label><label class="full">نبذة<textarea id="orgAbout">${esc(org.about||'')}</textarea></label><div class="actions"><button onclick="saveOrg()">حفظ</button></div></div>`}
window.saveOrg=async function(){await setDoc(doc(db,'organizations',user.uid),{org:$('#orgName').value,city:$('#orgCity').value,manager:$('#orgManager').value,about:$('#orgAbout').value,email:user.email,updatedAt:serverTimestamp()},{merge:true}); await load(); toast('تم حفظ بيانات الجمعية')}
</script>
</body>
