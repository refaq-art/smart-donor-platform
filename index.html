<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مستشار الدعم الذكي للجمعيات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0f766e;--d:#102522;--b:#f7f3ea;--c:#fffaf1;--m:#66736f;--l:#e5dccb;--r:#b42318;--gold:#b8892d}*{box-sizing:border-box}body{margin:0;background:var(--b);color:#172b28;font-family:Tajawal,Arial,sans-serif}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{background:var(--d);color:white;padding:20px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--g),var(--gold));display:grid;place-items:center;font-weight:800}.brand h1{font-size:18px;margin:0}.brand p{margin:3px 0;color:#cfe0dc;font-size:13px}.nav{display:grid;gap:8px}.nav button{text-align:right;border:1px solid transparent;background:transparent;color:white;padding:12px;border-radius:14px;cursor:pointer}.nav button.on,.nav button:hover{background:#ffffff18}.note{margin-top:18px;border:1px solid #ffffff22;background:#ffffff12;border-radius:16px;padding:12px;font-size:12px;line-height:1.7;color:#d8e8e4}.main{padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.top h2{font-size:30px;margin:0}.top p{color:var(--m);margin:5px 0 0}.btn,button{background:var(--g);color:white;border:0;border-radius:13px;padding:10px 14px;font-weight:700;cursor:pointer}.sec{background:white;color:#172b28;border:1px solid var(--l)}.danger{background:var(--r)}.grid{display:grid;gap:15px}.cards{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:var(--c);border:1px solid var(--l);border-radius:22px;padding:18px;box-shadow:0 12px 35px #00000012}.stat b{font-size:30px;color:var(--g);display:block;margin-top:6px}.small{font-size:13px;color:var(--m);line-height:1.7}.pill{display:inline-block;background:#e6f4f1;color:var(--g);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}.gold{background:#fff1d6;color:#915f00}.hot{background:#fee4e2;color:var(--r)}table{width:100%;border-collapse:collapse;background:var(--c);border-radius:18px;overflow:hidden}th,td{padding:12px;border-bottom:1px solid var(--l);text-align:right;vertical-align:top}th{color:var(--m);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:9}.box{background:var(--b);border-radius:24px;padding:20px;width:min(850px,96vw);max-height:90vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-weight:700;font-size:14px}input,select,textarea{width:100%;border:1px solid var(--l);border-radius:13px;padding:11px;background:white}textarea{min-height:95px}.empty{text-align:center;padding:30px;color:var(--m);border:1px dashed var(--l);border-radius:18px}.public{max-width:1100px;margin:auto;padding:24px}.hero{background:var(--d);color:white;border-radius:28px;padding:30px;margin-bottom:18px}.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:850px){.app{display:block}.cards,.two,.three,.projects,.form{grid-template-columns:1fr}.top{display:block}.side{position:relative}}
</style>
</head>
<body><div id="root"></div><script>
const K='smart-donor-v2';const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const seed={settings:{org:'جمعية رفاق الخيرية',city:'حائل',phone:'',email:'',about:'جمعية خيرية تعمل على رعاية وتمكين المستفيدين عبر مشاريع نوعية قابلة للقياس.'},donors:[{id:uid(),name:'شركة غذائية نموذجية',type:'شركة',sector:'غذائي',city:'حائل',contact:'مسؤول المسؤولية الاجتماعية',pref:'دعم غذائي وعيني',notes:'مناسبة لمشاريع الغذاء والحملات الموسمية'},{id:uid(),name:'مؤسسة مانحة تعليمية',type:'مؤسسة مانحة',sector:'تعليمي',city:'الرياض',contact:'مدير المنح',pref:'مشاريع تعليمية',notes:'تهتم بالأثر القابل للقياس'}],projects:[{id:uid(),name:'كفالة تعليم الأيتام',cat:'تعليمي',summary:'دعم تعليم وتمكين الطلاب الأيتام.',desc:'مشروع يهدف إلى دعم المسار التعليمي للأيتام عبر الرسوم والحقائب والمتابعة.',ben:120,amount:180000,duration:'عام دراسي',status:'متاح للدعم',show:true},{id:uid(),name:'السلال الغذائية للأسر',cat:'غذائي',summary:'توفير سلال غذائية شهرية للأسر المستفيدة.',desc:'مبادرة غذائية تضمن وصول الاحتياج الأساسي للأسر.',ben:250,amount:95000,duration:'3 أشهر',status:'أولوية عالية',show:true}],supports:[],tasks:[],interactions:[],interest:[]};let db=JSON.parse(localStorage.getItem(K)||'null')||seed;let p='dash';const $=s=>document.querySelector(s);function save(){localStorage.setItem(K,JSON.stringify(db))}function money(n){return (Number(n)||0).toLocaleString('ar-SA')+' ر.س'}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function total(d){return db.supports.filter(s=>s.donorId==d.id||s.donor==d.name).reduce((a,b)=>a+Number(b.amount||0),0)}function heat(d){let t=total(d);let recent=db.interactions.some(i=>i.donorId==d.id);return t>100000||recent?'ساخن':t>0?'دافئ':'بارد'}function layout(){if(location.hash=='#public')return publicPage();$('#root').innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="logo">د</div><div><h1>مستشار الدعم الذكي</h1><p>نسخة مجانية عامة</p></div></div><div class="nav">${nav('dash','الرئيسية')}${nav('donors','الداعمين')}${nav('projects','المشاريع')}${nav('support','الدعومات السابقة')}${nav('advisor','مستشار الدعم')}${nav('today','ماذا أفعل اليوم؟')}${nav('portfolio','محفظة المشاريع')}${nav('letters','الخطابات')}${nav('impact','تقارير الأثر')}${nav('settings','الإعدادات')}</div><div class="note">البيانات تحفظ داخل متصفحك فقط. هذه نسخة مجانية للتجربة، ولا تحتاج Lovable أو مفاتيح مدفوعة.</div></aside><main class="main"><div class="top"><div><h2 id="ttl"></h2><p id="sub"></p></div><div class="actions"><button class="sec" onclick="backup()">تصدير نسخة</button><label class="btn sec">استيراد نسخة<input type="file" hidden accept="application/json" onchange="importBackup(event)"></label></div></div><section id="c"></section></main></div>`;render()}function nav(id,t){return `<button class="${p==id?'on':''}" onclick="p='${id}';layout()">${t}</button>`}function title(t,s){$('#ttl').textContent=t;$('#sub').textContent=s||''}function render(){({dash,donors,projects,support,advisor,today,portfolio,letters,impact,settings}[p]||dash)()}
function dash(){title('الرئيسية','لوحة متابعة لتنمية الموارد');let sum=db.supports.reduce((a,b)=>a+Number(b.amount||0),0);$('#c').innerHTML=`<div class="grid cards"><div class="card stat"><span>الداعمين</span><b>${db.donors.length}</b></div><div class="card stat"><span>المشاريع</span><b>${db.projects.length}</b></div><div class="card stat"><span>الدعم السابق</span><b>${money(sum)}</b></div><div class="card stat"><span>مهام اليوم</span><b>${tasks().length}</b></div></div><br><div class="grid two"><div class="card"><h3>توصيات اليوم</h3>${tasks().map(x=>`<p>• ${x}</p>`).join('')||'<div class="empty">لا توجد توصيات</div>'}</div><div class="card"><h3>أعلى الداعمين</h3>${db.donors.map(d=>({n:d.name,t:total(d)})).filter(x=>x.t).sort((a,b)=>b.t-a.t).slice(0,5).map(x=>`<p><b>${esc(x.n)}</b><br><span class="small">${money(x.t)}</span></p>`).join('')||'<div class="empty">أضف الدعومات السابقة</div>'}</div></div>`}
function donors(){title('الداعمين','إدارة الجهات الداعمة');$('#c').innerHTML=`<div class="actions"><button onclick="donorForm()">إضافة داعم</button></div><br><table><tr><th>الجهة</th><th>القطاع</th><th>العلاقة</th><th>إجمالي الدعم</th><th>إجراء</th></tr>${db.donors.map(d=>`<tr><td><b>${esc(d.name)}</b><div class="small">${esc(d.type||'')} - ${esc(d.city||'')}</div></td><td>${esc(d.sector||'-')}</td><td><span class="pill ${heat(d)=='ساخن'?'hot':''}">${heat(d)}</span></td><td>${money(total(d))}</td><td><button class="sec" onclick="viewDonor('${d.id}')">فتح</button></td></tr>`).join('')}</table>`}function donorForm(id=''){let d=db.donors.find(x=>x.id==id)||{};modal(`<h3>${id?'تعديل':'إضافة'} داعم</h3><div class="form">${inp('name','اسم الجهة',d.name)}${inp('type','نوع الجهة',d.type||'شركة')}${inp('sector','القطاع',d.sector)}${inp('city','المدينة',d.city)}${inp('contact','مسؤول التواصل',d.contact)}${inp('pref','تفضيلات الدعم',d.pref)}${txt('notes','ملاحظات',d.notes)}</div><br><button onclick="saveDonor('${id}')">حفظ</button> <button class="sec" onclick="closeM()">إغلاق</button>`)}function saveDonor(id=''){let d=id?db.donors.find(x=>x.id==id):{id:uid()};Object.assign(d,vals());if(!id)db.donors.push(d);save();closeM();donors()}function viewDonor(id){let d=db.donors.find(x=>x.id==id), rows=db.supports.filter(s=>s.donorId==id||s.donor==d.name);modal(`<h3>${esc(d.name)}</h3><p class="small">${esc(d.type||'')} - ${esc(d.sector||'')} - ${esc(d.city||'')}</p><div class="grid cards"><div class="card stat"><span>حرارة العلاقة</span><b>${heat(d)}</b></div><div class="card stat"><span>إجمالي الدعم</span><b>${money(total(d))}</b></div><div class="card stat"><span>عدد الدعومات</span><b>${rows.length}</b></div><div class="card stat"><span>أفضل مشروع</span><b style="font-size:18px">${esc(bestProject(d)?.name||'-')}</b></div></div><br><div class="actions"><button onclick="supportForm('${id}')">إضافة دعم</button><button class="sec" onclick="interact('${id}')">تسجيل تواصل</button><button class="sec" onclick="donorForm('${id}')">تعديل</button></div><h3>سجل الدعم</h3>${supportTable(rows)}<p><b>توصية:</b> ${esc(advice(d))}</p>`)}
function projects(){title('المشاريع','مشاريع الجمعية وفرص الدعم');$('#c').innerHTML=`<div class="actions"><button onclick="projectForm()">إضافة مشروع</button></div><br><div class="grid three">${db.projects.map(x=>`<div class="card"><span class="pill gold">${esc(x.cat||'مشروع')}</span><h3>${esc(x.name)}</h3><p class="small">${esc(x.summary||'')}</p><b>${money(x.amount)}</b><p class="small">المستفيدون: ${x.ben||'-'} | ${esc(x.status||'')}</p><div class="actions"><button class="sec" onclick="projectForm('${x.id}')">تعديل</button><button onclick="p='advisor';window.sel='${x.id}';layout()">اقترح داعمين</button></div></div>`).join('')}</div>`}function projectForm(id=''){let x=db.projects.find(p=>p.id==id)||{};modal(`<h3>${id?'تعديل':'إضافة'} مشروع</h3><div class="form">${inp('name','اسم المشروع',x.name)}${inp('cat','التصنيف',x.cat)}${inp('amount','المبلغ',x.amount,'number')}${inp('ben','المستفيدون',x.ben,'number')}${inp('duration','المدة',x.duration)}${inp('status','الحالة',x.status||'متاح للدعم')}${txt('summary','وصف مختصر',x.summary)}${txt('desc','وصف تفصيلي',x.desc)}</div><br><button onclick="saveProject('${id}')">حفظ</button> <button class="sec" onclick="closeM()">إغلاق</button>`)}function saveProject(id=''){let x=id?db.projects.find(p=>p.id==id):{id:uid(),show:true};Object.assign(x,vals());x.amount=Number(x.amount||0);x.ben=Number(x.ben||0);if(!id)db.projects.push(x);save();closeM();projects()}
function support(){title('الدعومات السابقة','رفع وحفظ تاريخ دعم الجهات');$('#c').innerHTML=`<div class="actions"><button onclick="supportForm()">إدخال يدوي</button><button class="sec" onclick="csvTemplate()">تحميل قالب CSV</button><label class="btn sec">رفع CSV<input type="file" hidden accept=".csv" onchange="importCsv(event)"></label></div><br><div class="grid cards"><div class="card stat"><span>إجمالي الدعومات</span><b>${money(db.supports.reduce((a,b)=>a+Number(b.amount||0),0))}</b></div><div class="card stat"><span>عدد السجلات</span><b>${db.supports.length}</b></div><div class="card stat"><span>الجهات</span><b>${new Set(db.supports.map(s=>s.donor)).size}</b></div><div class="card stat"><span>تحتاج أثر</span><b>${db.supports.filter(s=>!s.impact).length}</b></div></div><br>${supportTable(db.supports)}`}function supportForm(did=''){let d=db.donors.find(x=>x.id==did);modal(`<h3>إضافة دعم سابق</h3><div class="form">${inp('donor','اسم الجهة',d?.name)}${inp('project','المشروع المدعوم','')}${inp('amount','مبلغ الدعم','', 'number')}${inp('date','تاريخ الدعم','', 'date')}${inp('type','نوع الدعم','نقدي')}${inp('cat','تصنيف المشروع','')}${inp('impact','تم إرسال تقرير أثر؟ نعم/لا','لا')}${inp('notes','ملاحظات','')}</div><br><button onclick="saveSupport('${did}')">حفظ</button> <button class="sec" onclick="closeM()">إغلاق</button>`)}function saveSupport(did=''){let v=vals(), d=db.donors.find(x=>x.id==did)||db.donors.find(x=>x.name==v.donor);if(!d){d={id:uid(),name:v.donor,type:'غير محدد',sector:v.cat,city:'',contact:'',pref:'',notes:'أُنشئ من الدعم السابق'};db.donors.push(d)}db.supports.push({id:uid(),donorId:d.id,donor:v.donor,project:v.project,amount:Number(v.amount||0),date:v.date,type:v.type,cat:v.cat,impact:String(v.impact).includes('نعم'),notes:v.notes});save();closeM();support()}function supportTable(rows){return rows.length?`<table><tr><th>الجهة</th><th>المشروع</th><th>المبلغ</th><th>التاريخ</th><th>الأثر</th></tr>${rows.map(s=>`<tr><td>${esc(s.donor)}</td><td>${esc(s.project||'-')}</td><td>${money(s.amount)}</td><td>${esc(s.date||'-')}</td><td>${s.impact?'نعم':'لا'}</td></tr>`).join('')}</table>`:'<div class="empty">لا توجد دعومات</div>'}
function advisor(){title('مستشار الدعم الذكي','اقتراح أنسب الداعمين لكل مشروع');let pid=window.sel||db.projects[0]?.id, pr=db.projects.find(x=>x.id==pid);let opts=db.projects.map(x=>`<option value="${x.id}" ${x.id==pid?'selected':''}>${esc(x.name)}</option>`).join('');let rec=pr?rank(pr):[];$('#c').innerHTML=`<div class="card"><label>اختر المشروع<select onchange="window.sel=this.value;advisor()">${opts}</select></label></div><br>${pr?rec.map(r=>`<div class="card"><h3>${esc(r.d.name)} <span class="pill">${r.score}%</span></h3><p>${esc(r.reason)}</p><p><b>المبلغ المقترح:</b> ${money(Math.max(10000,Math.min(pr.amount,Math.round((total(r.d)||50000)*.6))))}</p><div class="actions"><button onclick="makeLetter('${r.d.id}','${pr.id}')">خطاب</button><button class="sec" onclick="interact('${r.d.id}','${pr.id}')">متابعة</button></div></div><br>`).join(''):'<div class="empty">أضف مشروعًا أولًا</div>'}`}
function today(){title('ماذا أفعل اليوم؟','مهام ذكية ومتابعات مقترحة');let arr=tasks();$('#c').innerHTML=arr.length?`<div class="grid">${arr.map((t,i)=>`<div class="card"><span class="pill ${i<2?'hot':''}">${i<2?'عالية':'متوسطة'}</span><h3>${esc(t)}</h3><button onclick="alert('تم التنفيذ')">تم التنفيذ</button></div>`).join('')}</div>`:'<div class="empty">لا توجد مهام</div>'}
function portfolio(){title('محفظة المشاريع','رابط عام لمشاركة المشاريع');let url=location.href.split('#')[0]+'#public';$('#c').innerHTML=`<div class="card"><h3>رابط المحفظة</h3><input value="${url}" readonly onclick="this.select()"><br><br><div class="actions"><button onclick="navigator.clipboard.writeText('${url}');alert('تم النسخ')">نسخ الرابط</button><button class="sec" onclick="location.hash='public';layout()">معاينة عامة</button><button class="sec" onclick="downloadPortfolio()">تحميل HTML</button></div></div><br><div class="grid three">${db.projects.map(x=>`<div class="card"><h3>${esc(x.name)}</h3><p>${esc(x.summary||'')}</p><b>${money(x.amount)}</b></div>`).join('')}</div>`}function publicPage(){let s=db.settings;$('#root').innerHTML=`<div class="public"><div class="hero"><h1>${esc(s.org)}</h1><p>${esc(s.about)}</p><button onclick="location.hash='';layout()">دخول لوحة الجمعية</button></div><h2>مشاريع الجمعية المتاحة للدعم</h2><div class="projects">${db.projects.map(x=>`<div class="card"><span class="pill gold">${esc(x.cat)}</span><h3>${esc(x.name)}</h3><p>${esc(x.summary||'')}</p><p class="small">المستفيدون: ${x.ben||'-'} | المدة: ${esc(x.duration||'-')}</p><h3>${money(x.amount)}</h3><button onclick="interest('${x.id}')">أرغب بدعم هذا المشروع</button></div>`).join('')}</div></div>`}function interest(pid){let pr=db.projects.find(x=>x.id==pid);modal(`<h3>طلب اهتمام: ${esc(pr.name)}</h3><div class="form">${inp('donor','اسم الجهة','')}${inp('person','اسم الشخص','')}${inp('phone','الجوال','')}${inp('email','البريد','')}${inp('type','نوع الدعم','نقدي')}${txt('msg','رسالة','')}</div><br><button onclick="saveInterest('${pid}')">إرسال</button>`)}function saveInterest(pid){db.interest.push({id:uid(),projectId:pid,...vals(),createdAt:new Date().toISOString()});save();closeM();alert('تم تسجيل الطلب')}
function letters(){title('الخطابات','مولد خطابات ورسائل');$('#c').innerHTML=`<div class="card form">${select('ld','الداعم',db.donors)}${select('lp','المشروع',db.projects)}${inp('amount','المبلغ المقترح','')}${inp('kind','نوع الخطاب','طلب دعم')}<button onclick="genLetter()">توليد</button></div><br><textarea id="out" style="min-height:280px"></textarea>`}function makeLetter(did,pid){p='letters';layout();setTimeout(()=>{$('#ld').value=did;$('#lp').value=pid;genLetter()},50)}function genLetter(){let d=db.donors.find(x=>x.id==$('#ld').value), pr=db.projects.find(x=>x.id==$('#lp').value), a=$('#amount').value||pr.amount;$('#out').value=`السلام عليكم ورحمة الله وبركاته\n\nسعادة/ ${d.name} المحترمين\n\nيسر ${db.settings.org} أن تعرض عليكم فرصة دعم مشروع "${pr.name}"، والذي يهدف إلى ${pr.summary||'تحقيق أثر اجتماعي واضح'} ويستفيد منه ${pr.ben||'عدد من'} مستفيد.\n\nقيمة الدعم المقترحة: ${money(a)}.\n\nنأمل منكم دراسة فرصة الدعم، ويسعدنا تزويدكم بالتفاصيل أو ترتيب اجتماع تعريفي.\n\nوتفضلوا بقبول خالص الشكر والتقدير.`}
function impact(){title('تقارير الأثر','مولد تقرير أثر مختصر');$('#c').innerHTML=`<div class="card form">${select('idn','الداعم',db.donors)}${select('ipr','المشروع',db.projects)}${inp('ben','عدد المستفيدين','')}${txt('done','ما تم تنفيذه','تم تنفيذ المشروع وفق الخطة المعتمدة.')}<button onclick="genImpact()">توليد التقرير</button></div><br><textarea id="impactOut" style="min-height:280px"></textarea>`}function genImpact(){let d=db.donors.find(x=>x.id==$('#idn').value), pr=db.projects.find(x=>x.id==$('#ipr').value);$('#impactOut').value=`تقرير أثر مختصر\n\nالداعم: ${d.name}\nالمشروع: ${pr.name}\nعدد المستفيدين: ${$('#ben').value||pr.ben||'-'}\n\nما تم تنفيذه:\n${$('#done').value}\n\nالأثر:\nساهم دعمكم في تعزيز استقرار المستفيدين ورفع جودة الخدمة المقدمة لهم.\n\nشكرًا لدعمكم وعطائكم.`}
function settings(){title('الإعدادات','بيانات الجمعية والنسخ الاحتياطي');let s=db.settings;$('#c').innerHTML=`<div class="card form">${inp('org','اسم الجمعية',s.org)}${inp('city','المدينة',s.city)}${inp('phone','الجوال',s.phone)}${inp('email','البريد',s.email)}${txt('about','نبذة الجمعية',s.about)}<button onclick="db.settings=vals();save();alert('تم الحفظ')">حفظ</button><button class="danger" onclick="if(confirm('حذف كل البيانات؟')){localStorage.removeItem(K);db=seed;save();layout()}">إعادة التهيئة</button></div>`}
function rank(pr){return db.donors.map(d=>{let score=40, rs=[];if((d.sector||d.pref||'').includes(pr.cat)){score+=30;rs.push('اهتمامه قريب من تصنيف المشروع')}if(total(d)){score+=20;rs.push('لديه دعم سابق')}if(heat(d)=='ساخن'){score+=10;rs.push('العلاقة ساخنة')}return{d,score:Math.min(100,score),reason:rs.join('، ')||'مناسب كبداية للتواصل'}}).sort((a,b)=>b.score-a.score)}function bestProject(d){return db.projects.find(pr=>(d.sector||d.pref||'').includes(pr.cat))||db.projects[0]}function advice(d){let pr=bestProject(d);return pr?`يوصى بتجهيز خطاب مخصص لمشروع ${pr.name} والمتابعة خلال 3 أيام.`:'أضف مشاريع للحصول على توصية.'}function tasks(){let a=[];db.donors.forEach(d=>{if(total(d)>0&&!db.supports.filter(s=>s.donorId==d.id||s.donor==d.name).some(s=>s.impact))a.push(`إرسال تقرير أثر إلى ${d.name}`);if(heat(d)=='ساخن')a.push(`متابعة عاجلة مع ${d.name}`)});db.projects.forEach(pr=>a.push(`البحث عن داعم لمشروع ${pr.name}`));db.interest.forEach(i=>a.push(`متابعة طلب اهتمام من ${i.donor}`));return a.slice(0,12)}function interact(did,pid=''){let d=db.donors.find(x=>x.id==did);modal(`<h3>تسجيل تواصل مع ${esc(d.name)}</h3><div class="form">${inp('type','نوع التواصل','اتصال')}${inp('result','النتيجة','مهتم')}${inp('next','تاريخ المتابعة','', 'date')}${txt('note','ملاحظة','')}</div><br><button onclick="db.interactions.push({id:uid(),donorId:'${did}',projectId:'${pid}',...vals()});save();closeM();alert('تم التسجيل')">حفظ</button>`)}function importCsv(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let lines=r.result.split(/\r?\n/).filter(Boolean),n=0;lines.slice(1).forEach(line=>{let c=line.split(',');if(c[0]){let d=db.donors.find(x=>x.name==c[0]);if(!d){d={id:uid(),name:c[0],type:c[1]||'',sector:c[3]||'',city:'',contact:'',pref:'',notes:'من استيراد CSV'};db.donors.push(d)}db.supports.push({id:uid(),donorId:d.id,donor:c[0],project:c[2]||'',cat:c[3]||'',amount:Number(c[4]||0),type:c[5]||'',date:c[6]||'',impact:(c[7]||'').includes('نعم'),notes:c[8]||''});n++}});save();support();alert('تم استيراد '+n+' سجل')};r.readAsText(f,'utf-8')}function csvTemplate(){download('قالب_الدعومات.csv','اسم الجهة,نوع الجهة,اسم المشروع,تصنيف المشروع,مبلغ الدعم,نوع الدعم,تاريخ الدعم,هل تم إرسال تقرير أثر,ملاحظات\nشركة مثال,شركة,كفالة تعليم,تعليمي,50000,نقدي,2026-01-01,نعم,ملاحظة')}function backup(){download('smart-donor-backup.json',JSON.stringify(db,null,2))}function importBackup(e){let f=e.target.files[0],r=new FileReader();r.onload=()=>{db=JSON.parse(r.result);save();layout()};r.readAsText(f)}function downloadPortfolio(){download('portfolio.html','<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>محفظة المشاريع</title><body style="font-family:Arial;background:#f7f3ea;padding:24px"><h1>'+esc(db.settings.org)+'</h1>'+db.projects.map(x=>'<div style="background:white;border-radius:18px;padding:16px;margin:12px"><h2>'+esc(x.name)+'</h2><p>'+esc(x.summary)+'</p><b>'+money(x.amount)+'</b></div>').join('')+'</body></html>')}function download(n,c){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/plain;charset=utf-8'}));a.download=n;a.click()}function modal(h){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="m"><div class="box">${h}<br><button class="sec" onclick="closeM()">إغلاق</button></div></div>`)}function closeM(){$('#m')?.remove()}function inp(id,l,v='',type='text'){return `<label>${l}<input id="${id}" type="${type}" value="${esc(v??'')}"></label>`}function txt(id,l,v=''){return `<label class="full">${l}<textarea id="${id}">${esc(v??'')}</textarea></label>`}function select(id,l,arr){return `<label>${l}<select id="${id}">${arr.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>`}function vals(){let o={};document.querySelectorAll('#m input,#m textarea,#m select,#c input,#c textarea,#c select').forEach(e=>o[e.id]=e.value);return o}window.addEventListener('hashchange',layout);layout();
</script></body></html>
