<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />

<title>مستشار الدعم الذكي للجمعيات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f1e8;--card:#fffaf1;--card2:#ffffff;--ink:#152a27;--muted:#687773;--line:#e3dac8;--brand:#0f766e;--brand2:#0b5f59;--gold:#b8892d;--red:#b42318;--green:#087443;--blue:#175cd3;--shadow:0 18px 55px rgba(12,37,34,.10);--soft:rgba(15,118,110,.10)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at top right,#ecfff9 0,#f5f1e8 32%,#f8f4ec 100%);color:var(--ink);font-family:Tajawal,Arial,sans-serif}button,input,select,textarea{font-family:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:300px 1fr}.side{background:linear-gradient(180deg,#0d2a26,#102522 55%,#091816);color:white;padding:22px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}.logo{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--gold));display:grid;place-items:center;font-weight:900;font-size:25px;box-shadow:0 12px 28px rgba(0,0,0,.22)}.brand h1{margin:0;font-size:18px;line-height:1.3}.brand p{margin:4px 0 0;color:#bad1cd;font-size:13px}.nav{display:grid;gap:7px}.nav button{width:100%;background:transparent;color:#effaf8;border:1px solid transparent;text-align:right;padding:12px 13px;border-radius:15px;font-size:15px}.nav button.active,.nav button:hover{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.13)}.side-note{margin-top:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px;font-size:13px;line-height:1.8;color:#d7e8e5}.main{padding:26px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}.title h2{font-size:32px;margin:0;font-weight:900}.title p{margin:6px 0 0;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn,button.primary{border:0;background:var(--brand);color:white;border-radius:14px;padding:10px 15px;font-weight:800;box-shadow:0 10px 25px rgba(15,118,110,.18)}.secondary{background:white;color:var(--ink);border:1px solid var(--line);box-shadow:none}.danger{background:var(--red)}.goldbtn{background:var(--gold)}.hero{background:linear-gradient(135deg,#0e2c28,#0f766e);border-radius:30px;padding:26px;color:white;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:auto -80px -120px auto;width:320px;height:320px;background:rgba(255,255,255,.08);border-radius:50%}.hero h3{font-size:28px;margin:0 0 8px}.hero p{color:#dff4ef;margin:0;max-width:720px;line-height:1.8}.quick{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.quick button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);box-shadow:none}.grid{display:grid;gap:16px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1.2fr .8fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:rgba(255,250,241,.92);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}.card.white{background:white}.stat{position:relative;overflow:hidden}.stat span{color:var(--muted);font-weight:700}.stat b{display:block;font-size:31px;margin-top:8px;color:var(--brand)}.stat small{display:block;color:var(--muted);margin-top:4px}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 10px;background:#e7f5f2;color:var(--brand);font-size:12px;font-weight:900}.pill.gold{background:#fff1d6;color:#8a5b00}.pill.red{background:#fee4e2;color:var(--red)}.pill.blue{background:#e8f1ff;color:var(--blue)}.pill.green{background:#e7f8ef;color:var(--green)}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0 14px}.section-head h3{margin:0;font-size:22px}.table-wrap{overflow:auto;border-radius:22px;border:1px solid var(--line);background:white}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:13px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}th{color:var(--muted);font-size:13px;background:#fffcf6}.small{font-size:13px;color:var(--muted);line-height:1.8}.lead{font-size:16px;line-height:1.9;color:#43534f}.form{display:grid;gap:13px}.cols{grid-template-columns:repeat(2,minmax(0,1fr))}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}label{font-size:14px;font-weight:800}input,select,textarea{width:100%;border:1px solid var(--line);background:white;border-radius:14px;padding:11px 12px;color:var(--ink);font-size:15px}textarea{min-height:100px;resize:vertical}.modal{position:fixed;inset:0;background:rgba(2,18,16,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.box{background:var(--bg);border-radius:28px;padding:20px;width:min(920px,96vw);max-height:92vh;overflow:auto;box-shadow:0 30px 90px rgba(0,0,0,.28)}.box-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.box-head h3{margin:0}.empty{border:1px dashed var(--line);border-radius:20px;padding:34px;text-align:center;color:var(--muted);background:rgba(255,255,255,.45)}.project-card{background:white;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}.project-card h3{margin:0;font-size:20px}.progress{height:10px;background:#eee3d0;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#23b29f);border-radius:inherit}.recommendation{border:1px solid var(--line);background:white;border-radius:22px;padding:16px}.score{width:64px;height:64px;border-radius:22px;background:#e7f5f2;color:var(--brand);display:grid;place-items:center;font-size:20px;font-weight:900}.toast{position:fixed;left:18px;bottom:18px;background:#0d2a26;color:white;border-radius:16px;padding:13px 16px;display:none;z-index:30;box-shadow:var(--shadow)}.toast.show{display:block}.public-page{max-width:1180px;margin:auto;padding:26px}.public-hero{background:linear-gradient(135deg,#102522,#0f766e);color:white;border-radius:34px;padding:34px;margin-bottom:18px;box-shadow:var(--shadow)}.public-hero h1{font-size:34px;margin:0 0 8px}.public-hero p{color:#d9f1ed;line-height:1.8;max-width:760px}.public-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.mobile-toggle{display:none;background:white;color:var(--brand);border:1px solid var(--line)}.searchbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.searchbar input{max-width:360px}.kpi-line{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.kpi-line div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:12px}.kpi-line b{display:block;font-size:22px}@media(max-width:980px){.app{display:block}.side{position:relative;height:auto;display:none}.side.open{display:block}.mobile-toggle{display:inline-flex}.cards,.two,.three,.public-grid,.cols,.cols3{grid-template-columns:1fr}.main{padding:16px}.topbar{display:block}.actions{margin-top:12px}.title h2{font-size:27px}table{min-width:650px}.public-page{padding:16px}.hero h3,.public-hero h1{font-size:26px}}
</style>
</head>
<body>
<div id="root"></div><div id="modal" class="modal"></div><div id="toast" class="toast"></div>
<script>
const K='smart-donor-pro-v1';const $=s=>document.querySelector(s);const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const money=n=>(Number(n)||0).toLocaleString('ar-SA')+' ر.س';const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed={settings:{org:'جمعية رفاق الخيرية',city:'حائل',phone:'',email:'',about:'جمعية خيرية تعمل على رعاية وتمكين المستفيدين عبر مشاريع نوعية قابلة للقياس، وتبحث عن شراكات مستدامة مع الجهات المانحة والشركات.'},donors:[{id:uid(),name:'شركة غذائية نموذجية',type:'شركة',sector:'غذائي',city:'حائل',contact:'مسؤول المسؤولية الاجتماعية',phone:'',email:'',pref:'دعم عيني وغذائي وحملات موسمية',notes:'مناسبة لمشاريع السلال الغذائية وحملات ريال من كل طلب.'},{id:uid(),name:'مؤسسة مانحة تعليمية',type:'مؤسسة مانحة',sector:'تعليمي',city:'الرياض',contact:'مدير المنح',phone:'',email:'',pref:'مشاريع تعليمية وأثر قابل للقياس',notes:'تهتم بالتعليم وتمكين الأيتام.'},{id:uid(),name:'شركة تقنية واعدة',type:'شركة',sector:'تقني',city:'الرياض',contact:'مدير الشراكات',phone:'',email:'',pref:'تمكين رقمي وأجهزة وتدريب',notes:'مناسبة لرعاية نوادٍ تقنية وبرامج مهارية.'}],projects:[{id:uid(),name:'كفالة تعليم الأيتام',cat:'تعليمي',summary:'دعم المسار التعليمي للأيتام من خلال الرسوم والحقائب والمتابعة.',desc:'مشروع يهدف إلى تقليل التعثر التعليمي ورفع فرص النجاح للأيتام عبر دعم مالي وتعليمي مباشر.',ben:120,amount:180000,covered:25000,duration:'عام دراسي',status:'متاح للدعم',priority:'عالية',show:true},{id:uid(),name:'السلال الغذائية للأسر',cat:'غذائي',summary:'توفير سلال غذائية شهرية للأسر المستفيدة خلال الموسم.',desc:'مبادرة غذائية تضمن وصول الاحتياج الأساسي للأسر بطريقة منظمة وقابلة للقياس.',ben:250,amount:95000,covered:0,duration:'3 أشهر',status:'أولوية عالية',priority:'عالية',show:true},{id:uid(),name:'نادي رفاق القيمي',cat:'تنموي',summary:'بيئة تربوية تعليمية لغرس القيم والمهارات القيادية.',desc:'برنامج نوعي لبناء شخصية متوازنة، وتعزيز التفكير والانضباط والثقة والمسؤولية.',ben:80,amount:150000,covered:30000,duration:'6 أشهر',status:'متاح للدعم',priority:'متوسطة',show:true}],supports:[{id:uid(),donor:'مؤسسة مانحة تعليمية',project:'كفالة تعليم الأيتام',amount:60000,date:'2025-10-01',type:'نقدي',cat:'تعليمي',impact:false,notes:'دعم سابق يحتاج تقرير أثر'}],interactions:[],interest:[]};
let db=JSON.parse(localStorage.getItem(K)||'null')||seed;let page='dash';let selectedProject=null;function save(){localStorage.setItem(K,JSON.stringify(db))}function totalDonor(d){return db.supports.filter(s=>s.donorId==d.id||s.donor==d.name).reduce((a,b)=>a+Number(b.amount||0),0)}function heat(d){let total=totalDonor(d);let recent=db.interactions.some(i=>i.donorId==d.id);if(total>=100000||recent)return'ساخن';if(total>0)return'دافئ';return'بارد'}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function layout(){if(location.hash==='#public')return publicPage();$('#root').innerHTML=`<div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">د</div><div><h1>مستشار الدعم الذكي</h1><p>منصة مجانية للجمعيات</p></div></div><div class="nav">${nav('dash','الرئيسية')}${nav('donors','الداعمين')}${nav('projects','المشاريع')}${nav('support','الدعومات السابقة')}${nav('advisor','مستشار الدعم')}${nav('today','ماذا أفعل اليوم؟')}${nav('portfolio','محفظة المشاريع')}${nav('letters','الخطابات')}${nav('impact','تقارير الأثر')}${nav('settings','الإعدادات')}</div><div class="side-note">هذه النسخة تحفظ البيانات داخل متصفحك فقط. مناسبة للتجربة والعرض الأولي. استخدم التصدير لحفظ نسخة احتياطية.</div></aside><main class="main"><div class="topbar"><button class="mobile-toggle" onclick="$('#side').classList.toggle('open')">☰ القائمة</button><div class="title"><h2 id="ttl"></h2><p id="sub"></p></div><div class="actions"><button class="secondary" onclick="backup()">تصدير نسخة</button><label class="btn secondary">استيراد نسخة<input hidden type="file" accept="application/json" onchange="importBackup(event)"></label></div></div><section id="content"></section></main></div>`;render()}function nav(id,t){return`<button class="${page===id?'active':''}" onclick="page='${id}';layout()">${t}</button>`}function setTitle(t,s){$('#ttl').textContent=t;$('#sub').textContent=s||''}function render(){({dash,donors,projects,support,advisor,today,portfolio,letters,impact,settings}[page]||dash)()}
function dash(){setTitle('الرئيسية','نظرة تنفيذية على الداعمين والمشاريع والفرص');let sum=db.supports.reduce((a,b)=>a+Number(b.amount||0),0),target=db.projects.reduce((a,b)=>a+Number(b.amount||0),0),covered=db.projects.reduce((a,b)=>a+Number(b.covered||0),0);$('#content').innerHTML=`<div class="hero"><h3>مرحبًا بك في مستشار الدعم الذكي</h3><p>ابدأ بإضافة الداعمين والمشاريع والدعومات السابقة، ثم استخدم مستشار الدعم لمعرفة من تخاطب، وبأي مشروع، وبأي رسالة.</p><div class="quick"><button onclick="page='donors';layout()">إضافة داعم</button><button onclick="page='projects';layout()">إضافة مشروع</button><button onclick="page='portfolio';layout()">نسخ رابط المحفظة</button><button onclick="page='advisor';layout()">تشغيل المستشار</button></div><div class="kpi-line"><div><b>${db.donors.length}</b><span>داعم</span></div><div><b>${db.projects.length}</b><span>مشروع</span></div><div><b>${money(target-covered)}</b><span>فجوة تمويلية</span></div></div></div><br><div class="grid cards"><div class="card stat"><span>إجمالي الدعم السابق</span><b>${money(sum)}</b><small>من السجلات المدخلة</small></div><div class="card stat"><span>الداعمين الساخنين</span><b>${db.donors.filter(d=>heat(d)==='ساخن').length}</b><small>جاهزون للمتابعة</small></div><div class="card stat"><span>طلبات الاهتمام</span><b>${db.interest.length}</b><small>من رابط المحفظة</small></div><div class="card stat"><span>مهام اليوم</span><b>${smartTasks().length}</b><small>توصيات تلقائية</small></div></div><br><div class="grid two"><div class="card white"><div class="section-head"><h3>مركز التوصيات</h3><span class="pill blue">ذكي</span></div>${smartTasks().slice(0,8).map(x=>`<div class="recommendation"><b>${esc(x)}</b><p class="small">الإجراء المقترح: جهّز رسالة مختصرة أو خطاب متابعة وسجل نتيجة التواصل.</p></div><br>`).join('')||'<div class="empty">لا توجد توصيات حاليًا</div>'}</div><div class="card white"><div class="section-head"><h3>أعلى الداعمين</h3><span class="pill gold">أولوية</span></div>${topDonors().map(x=>`<div class="recommendation"><b>${esc(x.name)}</b><p class="small">إجمالي الدعم: ${money(x.total)} — ${x.impact?'تم إرسال أثر':'يحتاج تقرير أثر'}</p></div><br>`).join('')||'<div class="empty">أضف الدعومات السابقة لتظهر هنا</div>'}</div></div>`}
function donors(){setTitle('الداعمين','إدارة العلاقات مع الجهات المانحة والشركات');$('#content').innerHTML=`<div class="section-head"><div class="searchbar"><input id="q" placeholder="ابحث باسم الجهة أو القطاع" oninput="donors()" value="${esc($('#q')?.value||'')}"></div><button onclick="donorForm()">إضافة داعم</button></div>${donorTable()}`}function donorTable(){let q=$('#q')?.value||'';let arr=db.donors.filter(d=>(d.name+d.sector+d.city+d.type).includes(q));return`<div class="table-wrap"><table><thead><tr><th>الجهة</th><th>القطاع</th><th>حرارة العلاقة</th><th>إجمالي الدعم</th><th>أفضل مشروع</th><th>إجراء</th></tr></thead><tbody>${arr.map(d=>`<tr><td><b>${esc(d.name)}</b><div class="small">${esc(d.type||'')} — ${esc(d.city||'')}</div></td><td>${esc(d.sector||'-')}</td><td><span class="pill ${heat(d)==='ساخن'?'red':heat(d)==='دافئ'?'gold':''}">${heat(d)}</span></td><td>${money(totalDonor(d))}</td><td>${esc(bestProject(d)?.name||'-')}</td><td><button class="secondary" onclick="viewDonor('${d.id}')">فتح الملف</button></td></tr>`).join('')}</tbody></table></div>`}
function donorForm(id=''){let d=db.donors.find(x=>x.id===id)||{};modal(`<h3>${id?'تعديل داعم':'إضافة داعم جديد'}</h3><div class="form cols">${inp('name','اسم الجهة',d.name)}${inp('type','نوع الجهة',d.type||'شركة')}${inp('sector','القطاع',d.sector)}${inp('city','المدينة',d.city)}${inp('contact','مسؤول التواصل',d.contact)}${inp('phone','الجوال',d.phone)}${inp('email','البريد',d.email)}${inp('pref','تفضيلات الدعم',d.pref)}${txt('notes','ملاحظات داخلية',d.notes)}</div><br><button onclick="saveDonor('${id}')">حفظ</button>`)}function saveDonor(id=''){let v=vals(),d=id?db.donors.find(x=>x.id===id):{id:uid()};Object.assign(d,v);if(!id)db.donors.push(d);save();closeModal();donors();toast('تم حفظ الداعم')}
function viewDonor(id){let d=db.donors.find(x=>x.id===id),rows=db.supports.filter(s=>s.donorId===id||s.donor===d.name),bp=bestProject(d);modal(`<h3>${esc(d.name)}</h3><p class="small">${esc(d.type||'')} — ${esc(d.sector||'')} — ${esc(d.city||'')}</p><div class="grid cards"><div class="card stat"><span>حرارة العلاقة</span><b>${heat(d)}</b></div><div class="card stat"><span>إجمالي الدعم</span><b>${money(totalDonor(d))}</b></div><div class="card stat"><span>عدد الدعومات</span><b>${rows.length}</b></div><div class="card stat"><span>احتمالية الدعم</span><b>${scoreDonor(d,bp)}%</b></div></div><br><div class="actions"><button onclick="supportForm('${id}')">إضافة دعم سابق</button><button class="secondary" onclick="interactionForm('${id}')">تسجيل تواصل</button><button class="secondary" onclick="makeLetter('${id}','${bp?.id||''}')">إنشاء خطاب</button><button class="secondary" onclick="donorForm('${id}')">تعديل</button></div><br><div class="grid two"><div class="card white"><h3>توصية العلاقة</h3><p class="lead">${esc(advice(d))}</p></div><div class="card white"><h3>تفضيلات الداعم</h3><p class="lead">${esc(d.pref||'لم تُسجل تفضيلات بعد.')}</p></div></div><br><h3>سجل الدعومات السابقة</h3>${supportTable(rows)}`)}
function projects(){setTitle('المشاريع','إدارة مشاريع الجمعية وفرص الدعم');$('#content').innerHTML=`<div class="section-head"><h3>محفظة المشاريع الداخلية</h3><button onclick="projectForm()">إضافة مشروع</button></div><div class="grid three">${db.projects.map(projectCard).join('')}</div>`}function projectCard(p){let pct=Math.min(100,Math.round((Number(p.covered||0)/Math.max(1,Number(p.amount||0)))*100));return`<div class="project-card"><div><span class="pill gold">${esc(p.cat||'مشروع')}</span> <span class="pill ${p.priority==='عالية'?'red':'green'}">${esc(p.priority||'متوسطة')}</span></div><h3>${esc(p.name)}</h3><p class="small">${esc(p.summary||'')}</p><div><b>${money(p.amount)}</b><div class="small">المغطى: ${money(p.covered||0)} — المتبقي: ${money((p.amount||0)-(p.covered||0))}</div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="small">${pct}% تمويل | المستفيدون: ${p.ben||'-'} | ${esc(p.duration||'-')}</div><div class="actions"><button class="secondary" onclick="projectForm('${p.id}')">تعديل</button><button onclick="selectedProject='${p.id}';page='advisor';layout()">اقترح داعمين</button></div></div>`}function projectForm(id=''){let p=db.projects.find(x=>x.id===id)||{};modal(`<h3>${id?'تعديل مشروع':'إضافة مشروع'}</h3><div class="form cols">${inp('name','اسم المشروع',p.name)}${inp('cat','التصنيف',p.cat)}${inp('amount','المبلغ المطلوب',p.amount,'number')}${inp('covered','المبلغ المغطى',p.covered||0,'number')}${inp('ben','عدد المستفيدين',p.ben,'number')}${inp('duration','مدة التنفيذ',p.duration)}${inp('status','الحالة',p.status||'متاح للدعم')}${inp('priority','الأولوية',p.priority||'متوسطة')}${txt('summary','وصف مختصر',p.summary)}${txt('desc','وصف تفصيلي',p.desc)}</div><br><button onclick="saveProject('${id}')">حفظ المشروع</button>`)}function saveProject(id=''){let v=vals(),p=id?db.projects.find(x=>x.id===id):{id:uid(),show:true};v.amount=Number(v.amount||0);v.covered=Number(v.covered||0);v.ben=Number(v.ben||0);Object.assign(p,v);if(!id)db.projects.push(p);save();closeModal();projects();toast('تم حفظ المشروع')}
function support(){setTitle('الدعومات السابقة','ذاكرة تاريخية للدعم السابق والجهات المانحة');$('#content').innerHTML=`<div class="section-head"><div class="actions"><button onclick="supportForm()">إدخال يدوي</button><button class="secondary" onclick="csvTemplate()">تحميل قالب CSV</button><label class="btn secondary">رفع CSV<input hidden type="file" accept=".csv" onchange="importCsv(event)"></label></div></div><div class="grid cards"><div class="card stat"><span>إجمالي الدعومات</span><b>${money(db.supports.reduce((a,b)=>a+Number(b.amount||0),0))}</b></div><div class="card stat"><span>عدد السجلات</span><b>${db.supports.length}</b></div><div class="card stat"><span>جهات داعمة</span><b>${new Set(db.supports.map(s=>s.donor)).size}</b></div><div class="card stat"><span>تحتاج تقرير أثر</span><b>${db.supports.filter(s=>!s.impact).length}</b></div></div><br>${supportTable(db.supports)}`}function supportForm(donorId=''){let d=db.donors.find(x=>x.id===donorId);modal(`<h3>إضافة دعم سابق</h3><div class="form cols">${inp('donor','اسم الجهة',d?.name||'')}${inp('project','المشروع المدعوم','')}${inp('amount','مبلغ الدعم','', 'number')}${inp('date','تاريخ الدعم','', 'date')}${inp('type','نوع الدعم','نقدي')}${inp('cat','تصنيف المشروع','')}${inp('impact','تم إرسال تقرير أثر؟ اكتب نعم أو لا','لا')}${inp('notes','ملاحظات','')}</div><br><button onclick="saveSupport('${donorId}')">حفظ الدعم</button>`)}function saveSupport(donorId=''){let v=vals(),d=db.donors.find(x=>x.id===donorId)||db.donors.find(x=>x.name===v.donor);if(!d){d={id:uid(),name:v.donor,type:'غير محدد',sector:v.cat,city:'',contact:'',phone:'',email:'',pref:'',notes:'أُنشئ من سجل الدعومات السابقة'};db.donors.push(d)}db.supports.push({id:uid(),donorId:d.id,donor:v.donor,project:v.project,amount:Number(v.amount||0),date:v.date,type:v.type,cat:v.cat,impact:String(v.impact).includes('نعم'),notes:v.notes});save();closeModal();support();toast('تم إضافة الدعم السابق')}function supportTable(rows){return rows.length?`<div class="table-wrap"><table><thead><tr><th>الجهة</th><th>المشروع</th><th>المبلغ</th><th>التاريخ</th><th>نوع الدعم</th><th>تقرير أثر</th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${esc(s.donor)}</b><div class="small">${esc(s.cat||'')}</div></td><td>${esc(s.project||'-')}</td><td>${money(s.amount)}</td><td>${esc(s.date||'-')}</td><td>${esc(s.type||'-')}</td><td><span class="pill ${s.impact?'green':'red'}">${s.impact?'تم':'لم يرسل'}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد دعومات سابقة بعد</div>'}
function advisor(){setTitle('مستشار الدعم الذكي','يعطيك أفضل الداعمين لكل مشروع مع سبب الترشيح');let pid=selectedProject||db.projects[0]?.id,pr=db.projects.find(x=>x.id===pid);$('#content').innerHTML=`<div class="card white"><label>اختر المشروع<select onchange="selectedProject=this.value;advisor()">${db.projects.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label></div><br>${pr?rank(pr).map(r=>`<div class="recommendation"><div class="actions" style="justify-content:space-between"><div><h3>${esc(r.d.name)}</h3><p class="small">${esc(r.d.type||'')} — ${esc(r.d.sector||'')} — العلاقة: ${heat(r.d)}</p></div><div class="score">${r.score}%</div></div><p class="lead">${esc(r.reason)}</p><div class="grid three"><div class="card"><b>نوع الدعم الأنسب</b><p class="small">${supportType(r.d,pr)}</p></div><div class="card"><b>المبلغ المقترح</b><p class="small">${money(suggestAmount(r.d,pr))}</p></div><div class="card"><b>القناة الأفضل</b><p class="small">${heat(r.d)==='ساخن'?'اتصال ثم زيارة':'خطاب رسمي ثم متابعة واتساب'}</p></div></div><br><div class="actions"><button onclick="makeLetter('${r.d.id}','${pr.id}')">إنشاء خطاب</button><button class="secondary" onclick="interactionForm('${r.d.id}','${pr.id}')">تسجيل متابعة</button></div></div><br>`).join(''):'<div class="empty">أضف مشروعًا أولًا</div>'}`}
function today(){setTitle('ماذا أفعل اليوم؟','قائمة إجراءات ذكية للموظف');let arr=smartTasks();$('#content').innerHTML=arr.length?`<div class="grid">${arr.map((t,i)=>`<div class="card white"><span class="pill ${i<3?'red':'blue'}">${i<3?'أولوية عالية':'متوسطة'}</span><h3>${esc(t)}</h3><p class="small">نفّذ الإجراء وسجل النتيجة حتى تتحسن توصيات المنصة.</p><div class="actions"><button onclick="toast('تم تسجيل المهمة كمنجزة')">تم التنفيذ</button><button class="secondary" onclick="toast('تم التأجيل')">تأجيل</button></div></div>`).join('')}</div>`:'<div class="empty">لا توجد مهام اليوم</div>'}
function portfolio(){setTitle('محفظة المشاريع','رابط عام لمشاركة كل مشاريع الجمعية');let url=location.href.split('#')[0]+'#public';$('#content').innerHTML=`<div class="hero"><h3>رابط محفظة مشاريع الجمعية</h3><p>شارك هذا الرابط مع الجهات المانحة ليطّلعوا على المشاريع المتاحة للدعم في مكان واحد.</p><div class="quick"><button onclick="navigator.clipboard.writeText('${url}');toast('تم نسخ الرابط')">نسخ الرابط</button><button onclick="location.hash='public';layout()">معاينة الرابط</button><button onclick="downloadPortfolio()">تحميل صفحة HTML</button></div></div><br><div class="card white"><input value="${url}" readonly onclick="this.select()"></div><br><div class="grid three">${db.projects.map(projectCard).join('')}</div>`}
function publicPage(){let s=db.settings;$('#root').innerHTML=`<div class="public-page"><section class="public-hero"><h1>${esc(s.org)}</h1><p>${esc(s.about)}</p><div class="kpi-line"><div><b>${db.projects.length}</b><span>مشروع متاح</span></div><div><b>${db.projects.reduce((a,b)=>a+Number(b.ben||0),0)}</b><span>مستفيد مستهدف</span></div><div><b>${money(db.projects.reduce((a,b)=>a+Number(b.amount||0),0))}</b><span>إجمالي فرص الدعم</span></div></div><br><button onclick="location.hash='';layout()">دخول لوحة الجمعية</button></section><div class="section-head"><h2>مشاريع الجمعية المتاحة للدعم</h2></div><div class="public-grid">${db.projects.map(p=>`<div class="project-card"><span class="pill gold">${esc(p.cat)}</span><h3>${esc(p.name)}</h3><p class="small">${esc(p.summary)}</p><p><b>${money(p.amount)}</b></p><p class="small">المستفيدون: ${p.ben||'-'} | المدة: ${esc(p.duration||'-')}</p><button onclick="interestForm('${p.id}')">أرغب بدعم هذا المشروع</button></div>`).join('')}</div></div>`}
function letters(){setTitle('الخطابات','مولد خطابات رسمية قابلة للتعديل');$('#content').innerHTML=`<div class="card white form cols">${select('ld','الداعم',db.donors)}${select('lp','المشروع',db.projects)}${inp('amount','المبلغ المقترح','')}${inp('kind','نوع الخطاب','طلب دعم')}<button onclick="generateLetter()">توليد الخطاب</button></div><br><textarea id="letterOut" style="min-height:330px"></textarea>`}function impact(){setTitle('تقارير الأثر','مولد تقرير أثر مختصر للداعمين');$('#content').innerHTML=`<div class="card white form cols">${select('idn','الداعم',db.donors)}${select('ipr','المشروع',db.projects)}${inp('ben','عدد المستفيدين','')}${txt('done','ما تم تنفيذه','تم تنفيذ المشروع وفق الخطة المعتمدة.')}<button onclick="generateImpact()">توليد التقرير</button></div><br><textarea id="impactOut" style="min-height:330px"></textarea>`}function settings(){setTitle('الإعدادات','بيانات الجمعية والنسخ الاحتياطي');let s=db.settings;$('#content').innerHTML=`<div class="card white form cols">${inp('org','اسم الجمعية',s.org)}${inp('city','المدينة',s.city)}${inp('phone','الجوال',s.phone)}${inp('email','البريد',s.email)}${txt('about','نبذة الجمعية',s.about)}<button onclick="db.settings=vals();save();toast('تم حفظ الإعدادات')">حفظ</button><button class="danger" onclick="resetAll()">إعادة تهيئة البيانات</button></div>`}
function topDonors(){return db.donors.map(d=>({name:d.name,total:totalDonor(d),impact:db.supports.filter(s=>s.donorId===d.id||s.donor===d.name).some(s=>s.impact)})).filter(x=>x.total>0).sort((a,b)=>b.total-a.total).slice(0,5)}function bestProject(d){return db.projects.find(p=>(d.sector+d.pref).includes(p.cat))||db.projects[0]}function scoreDonor(d,p){let s=40;if(!p)return s;if((d.sector+d.pref).includes(p.cat))s+=30;if(totalDonor(d)>0)s+=20;if(heat(d)==='ساخن')s+=10;return Math.min(100,s)}function rank(p){return db.donors.map(d=>{let score=scoreDonor(d,p);let reasons=[];if((d.sector+d.pref).includes(p.cat))reasons.push('توافق واضح بين اهتمام الداعم وتصنيف المشروع');if(totalDonor(d)>0)reasons.push('لديه سجل دعم سابق يمكن البناء عليه');if(heat(d)==='ساخن')reasons.push('العلاقة ساخنة وتستحق متابعة مباشرة');if(!reasons.length)reasons.push('مناسب كبداية للتواصل وبناء علاقة');return{d,score,reason:reasons.join('، ')}}).sort((a,b)=>b.score-a.score)}function suggestAmount(d,p){let avg=totalDonor(d)||50000;return Math.max(10000,Math.min(Number(p.amount||0),Math.round(avg*.65)))}function supportType(d,p){if((d.sector||'').includes('غذائي'))return'دعم عيني أو سلال أو حملة مشتركة';if((d.sector||'').includes('تقني'))return'رعاية تقنية أو أجهزة أو تدريب';return'دعم نقدي أو شراكة مشروع'}function advice(d){let p=bestProject(d);return p?`الجهة مناسبة لمشروع ${p.name}. ابدأ بخطاب مخصص يربط المشروع باهتماماتها، ثم تابع خلال 3 أيام.`:'أضف مشاريع للحصول على توصية أدق.'}function smartTasks(){let a=[];db.donors.forEach(d=>{if(totalDonor(d)>0&&!db.supports.filter(s=>s.donorId===d.id||s.donor===d.name).some(s=>s.impact))a.push(`إرسال تقرير أثر إلى ${d.name}`);if(heat(d)==='ساخن')a.push(`متابعة عاجلة مع ${d.name}`)});db.projects.forEach(p=>{let rem=(p.amount||0)-(p.covered||0);if(rem>0)a.push(`البحث عن داعم لتغطية ${money(rem)} من مشروع ${p.name}`)});db.interest.forEach(i=>a.push(`متابعة طلب اهتمام من ${i.donor}`));return a.slice(0,14)}
function interactionForm(did,pid=''){let d=db.donors.find(x=>x.id===did);modal(`<h3>تسجيل تواصل مع ${esc(d.name)}</h3><div class="form cols">${inp('type','نوع التواصل','اتصال')}${inp('result','النتيجة','مهتم')}${inp('next','تاريخ المتابعة القادم','', 'date')}${txt('note','ملاحظة','')}</div><br><button onclick="saveInteraction('${did}','${pid}')">حفظ التواصل</button>`)}function saveInteraction(did,pid=''){db.interactions.push({id:uid(),donorId:did,projectId:pid,...vals(),createdAt:new Date().toISOString()});save();closeModal();toast('تم تسجيل التواصل')}function interestForm(pid){let p=db.projects.find(x=>x.id===pid);modal(`<h3>طلب اهتمام: ${esc(p.name)}</h3><div class="form cols">${inp('donor','اسم الجهة','')}${inp('person','اسم الشخص','')}${inp('phone','الجوال','')}${inp('email','البريد','')}${inp('type','نوع الدعم','نقدي')}${txt('msg','رسالة أو ملاحظة','')}</div><br><button onclick="saveInterest('${pid}')">إرسال الطلب</button>`)}function saveInterest(pid){db.interest.push({id:uid(),projectId:pid,...vals(),createdAt:new Date().toISOString()});save();closeModal();toast('تم تسجيل طلب الاهتمام')}function makeLetter(did,pid){page='letters';layout();setTimeout(()=>{$('#ld').value=did;if(pid)$('#lp').value=pid;generateLetter()},80)}function generateLetter(){let d=db.donors.find(x=>x.id===$('#ld').value),p=db.projects.find(x=>x.id===$('#lp').value),a=$('#amount').value||p.amount;$('#letterOut').value=`السلام عليكم ورحمة الله وبركاته\n\nسعادة/ ${d.name} المحترمين\n\nتحية طيبة، وبعد:\n\nيسر ${db.settings.org} أن تعرض عليكم فرصة دعم مشروع "${p.name}"، والذي يهدف إلى ${p.summary||'تحقيق أثر اجتماعي واضح'}، ويخدم ${p.ben||'عددًا من'} مستفيد.\n\nقيمة الدعم المقترحة: ${money(a)}.\n\nسبب ملاءمة المشروع لكم: ${advice(d)}\n\nنأمل منكم دراسة فرصة الدعم، ويسعدنا تزويدكم بملف تفصيلي أو ترتيب اجتماع تعريفي.\n\nوتفضلوا بقبول خالص الشكر والتقدير.`}function generateImpact(){let d=db.donors.find(x=>x.id===$('#idn').value),p=db.projects.find(x=>x.id===$('#ipr').value);$('#impactOut').value=`تقرير أثر مختصر\n\nالداعم: ${d.name}\nالمشروع: ${p.name}\nعدد المستفيدين: ${$('#ben').value||p.ben||'-'}\n\nما تم تنفيذه:\n${$('#done').value}\n\nالأثر:\nساهم دعمكم في تعزيز استقرار المستفيدين ورفع جودة الخدمة المقدمة لهم، ونسعد باستمرار هذه الشراكة في فرص دعم قادمة.\n\nشكرًا لدعمكم وعطائكم.`}
function importCsv(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let lines=r.result.split(/\r?\n/).filter(Boolean),n=0;lines.slice(1).forEach(line=>{let c=line.split(',');if(c[0]){let d=db.donors.find(x=>x.name===c[0]);if(!d){d={id:uid(),name:c[0],type:c[1]||'',sector:c[3]||'',city:'',contact:'',phone:'',email:'',pref:'',notes:'من استيراد CSV'};db.donors.push(d)}db.supports.push({id:uid(),donorId:d.id,donor:c[0],project:c[2]||'',cat:c[3]||'',amount:Number(c[4]||0),type:c[5]||'',date:c[6]||'',impact:(c[7]||'').includes('نعم'),notes:c[8]||''});n++}});save();support();toast('تم استيراد '+n+' سجل')};r.readAsText(f,'utf-8')}function csvTemplate(){download('قالب_الدعومات.csv','اسم الجهة,نوع الجهة,اسم المشروع,تصنيف المشروع,مبلغ الدعم,نوع الدعم,تاريخ الدعم,هل تم إرسال تقرير أثر,ملاحظات\nشركة مثال,شركة,كفالة تعليم,تعليمي,50000,نقدي,2026-01-01,نعم,ملاحظة')}function backup(){download('smart-donor-backup.json',JSON.stringify(db,null,2))}function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();layout();toast('تم استيراد النسخة')}catch{toast('ملف غير صالح')}};r.readAsText(f)}function downloadPortfolio(){let html='<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>محفظة المشاريع</title><body style="font-family:Arial;background:#f5f1e8;padding:24px"><h1>'+esc(db.settings.org)+'</h1><p>'+esc(db.settings.about)+'</p>'+db.projects.map(p=>'<div style="background:white;border:1px solid #ddd;border-radius:18px;padding:16px;margin:12px 0"><h2>'+esc(p.name)+'</h2><p>'+esc(p.summary)+'</p><b>'+money(p.amount)+'</b></div>').join('')+'</body></html>';download('portfolio.html',html)}function download(n,c){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/plain;charset=utf-8'}));a.download=n;a.click()}function resetAll(){if(confirm('سيتم حذف البيانات المحلية من هذا المتصفح فقط. هل أنت متأكد؟')){localStorage.removeItem(K);db=seed;save();layout();toast('تمت إعادة التهيئة')}}function modal(h){$('#modal').innerHTML=`<div class="box"><div class="box-head"><h3></h3><button class="secondary" onclick="closeModal()">إغلاق</button></div>${h}</div>`;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}function inp(id,l,v='',type='text'){return`<label>${l}<input id="${id}" type="${type}" value="${esc(v??'')}"></label>`}function txt(id,l,v=''){return`<label style="grid-column:1/-1">${l}<textarea id="${id}">${esc(v??'')}</textarea></label>`}function select(id,l,arr){return`<label>${l}<select id="${id}">${arr.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>`}function vals(){let o={};document.querySelectorAll('.box input,.box textarea,.box select,#content input,#content textarea,#content select').forEach(e=>o[e.id]=e.value);return o}window.addEventListener('hashchange',layout);layout();
</script>
