<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مستشار الدعم الذكي للجمعيات</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><style>:root{--bg:#f6f1e8;--ink:#132724;--muted:#687773;--line:#e2d8c7;--brand:#0f766e;--gold:#b8892d;--red:#b42318;--green:#087443;--blue:#175cd3;--shadow:0 18px 55px rgba(12,37,34,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#e8fff7,#f6f1e8 36%,#faf6ef);font-family:Tajawal,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#0d2a26,#102522 60%,#071816);color:#fff;padding:22px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}.logo{width:54px;height:54px;border-radius:20px;background:linear-gradient(135deg,var(--brand),var(--gold));display:grid;place-items:center;font-weight:900;font-size:26px}.brand h1{font-size:18px;margin:0}.brand p{margin:4px 0 0;color:#bad1cd;font-size:13px}.nav{display:grid;gap:7px}.nav button{width:100%;text-align:right;background:transparent;color:#effaf8;border:1px solid transparent;padding:12px;border-radius:15px}.nav button.active,.nav button:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.13)}.note{margin-top:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px;font-size:13px;line-height:1.8;color:#d7e8e5}.main{padding:26px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}.title h2{font-size:32px;margin:0;font-weight:900}.title p{margin:6px 0 0;color:var(--muted)}button,.btn{border:0;background:var(--brand);color:white;border-radius:14px;padding:10px 15px;font-weight:800;box-shadow:0 10px 25px rgba(15,118,110,.18)}.secondary{background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)!important;box-shadow:none!important}.danger{background:var(--red)!important}.hero{background:linear-gradient(135deg,#0e2c28,#0f766e);border-radius:30px;padding:26px;color:#fff;box-shadow:var(--shadow);overflow:hidden}.hero h3{font-size:28px;margin:0 0 8px}.hero p{color:#dff4ef;margin:0;line-height:1.8;max-width:850px}.quick,.actions{display:flex;gap:9px;flex-wrap:wrap}.quick{margin-top:18px}.quick button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);box-shadow:none}.grid{display:grid;gap:16px}.cards{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.15fr .85fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:rgba(255,250,242,.95);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}.white{background:white!important}.stat span{color:var(--muted);font-weight:700}.stat b{display:block;font-size:31px;margin-top:8px;color:var(--brand)}.small{font-size:13px;color:var(--muted);line-height:1.8}.lead{font-size:16px;line-height:1.9;color:#43534f}.pill{display:inline-flex;border-radius:999px;padding:6px 10px;background:#e7f5f2;color:var(--brand);font-size:12px;font-weight:900}.gold{background:#fff1d6!important;color:#8a5b00!important}.red{background:#fee4e2!important;color:var(--red)!important}.green{background:#e7f8ef!important;color:var(--green)!important}.blue{background:#e8f1ff!important;color:var(--blue)!important}.section{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0 14px}.table{overflow:auto;border-radius:22px;border:1px solid var(--line);background:white}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:13px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}th{color:var(--muted);font-size:13px;background:#fffcf6}input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;color:var(--ink)}textarea{min-height:120px}.form{display:grid;gap:13px}.cols{grid-template-columns:repeat(2,1fr)}label{font-weight:800;font-size:14px}.modal{position:fixed;inset:0;background:rgba(2,18,16,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.box{background:var(--bg);border-radius:28px;padding:20px;width:min(960px,96vw);max-height:92vh;overflow:auto}.box-head{display:flex;justify-content:space-between;margin-bottom:12px}.empty{border:1px dashed var(--line);border-radius:20px;padding:34px;text-align:center;color:var(--muted);background:rgba(255,255,255,.5)}.project{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}.progress{height:10px;background:#eee3d0;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#23b29f)}.score{width:64px;height:64px;border-radius:22px;background:#e7f5f2;color:var(--brand);display:grid;place-items:center;font-size:20px;font-weight:900}.toast{position:fixed;left:18px;bottom:18px;background:#0d2a26;color:#fff;border-radius:16px;padding:13px 16px;display:none;z-index:30}.toast.show{display:block}.public{max-width:1180px;margin:auto;padding:26px}.publicHero{background:linear-gradient(135deg,#102522,#0f766e);color:white;border-radius:34px;padding:34px;margin-bottom:18px}.radar{border-right:5px solid var(--brand)}.mobile{display:none}@media(max-width:980px){.app{display:block}.side{display:none;height:auto;position:relative}.side.open{display:block}.mobile{display:inline-flex}.cards,.two,.three,.cols{grid-template-columns:1fr}.main{padding:16px}.top{display:block}table{min-width:720px}}</style></head><body><div id="root"></div><div id="modal" class="modal"></div><div id="toast" class="toast"></div><script>const K='smart-donor-suite-live-v2',uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),$=s=>document.querySelector(s),money=n=>(Number(n)||0).toLocaleString('ar-SA')+' ر.س',today=()=>new Date().toISOString().slice(0,10),esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const seed={settings:{org:'جمعية رفاق الخيرية',city:'حائل',phone:'',email:'',about:'جمعية خيرية تعمل على رعاية وتمكين المستفيدين عبر مشاريع نوعية قابلة للقياس، وتبحث عن شراكات مستدامة مع الجهات المانحة والشركات.'},donors:[{id:uid(),name:'شركة غذائية نموذجية',type:'شركة',sector:'غذائي',city:'حائل',contact:'مسؤول المسؤولية الاجتماعية',pref:'دعم عيني وغذائي وحملات موسمية',notes:'مناسبة لمشاريع السلال الغذائية.'},{id:uid(),name:'مؤسسة مانحة تعليمية',type:'مؤسسة مانحة',sector:'تعليمي',city:'الرياض',contact:'مدير المنح',pref:'مشاريع تعليمية وأثر قابل للقياس',notes:'تهتم بالتعليم وتمكين الأيتام.'},{id:uid(),name:'شركة تقنية واعدة',type:'شركة',sector:'تقني',city:'الرياض',contact:'مدير الشراكات',pref:'تمكين رقمي وأجهزة وتدريب',notes:'مناسبة لرعاية نوادٍ تقنية.'}],projects:[{id:uid(),name:'كفالة تعليم الأيتام',cat:'تعليمي',summary:'دعم المسار التعليمي للأيتام من خلال الرسوم والحقائب والمتابعة.',ben:120,amount:180000,covered:25000,duration:'عام دراسي',priority:'عالية'},{id:uid(),name:'السلال الغذائية للأسر',cat:'غذائي',summary:'توفير سلال غذائية شهرية للأسر المستفيدة خلال الموسم.',ben:250,amount:95000,covered:0,duration:'3 أشهر',priority:'عالية'},{id:uid(),name:'نادي رفاق القيمي',cat:'تنموي',summary:'بيئة تربوية تعليمية لغرس القيم والمهارات القيادية.',ben:80,amount:150000,covered:30000,duration:'6 أشهر',priority:'متوسطة'}],supports:[{id:uid(),donor:'مؤسسة مانحة تعليمية',project:'كفالة تعليم الأيتام',amount:60000,date:'2025-10-01',type:'نقدي',cat:'تعليمي',impact:false}],opps:[{id:uid(),name:'مؤسسة مانحة تعليمية',title:'فرصة دعم مشاريع تعليمية وتمكينية',sector:'تعليمي',city:'الرياض',status:'مفتوحة',deadline:'2026-08-30',amount:'50,000 - 200,000',source:'رصد يدوي',url:'',notes:'مناسبة لمشاريع التعليم والأثر القابل للقياس',createdAt:today()},{id:uid(),name:'شركة غذائية نموذجية',title:'مبادرة مسؤولية اجتماعية غذائية',sector:'غذائي',city:'حائل',status:'تحت المتابعة',deadline:'2026-09-15',amount:'دعم عيني / سلال',source:'رادار الفرص',url:'',notes:'مناسبة لمشروع السلال الغذائية أو حملة مشتركة',createdAt:today()}],interactions:[],interest:[]};let db=JSON.parse(localStorage.getItem(K)||'null')||seed;['donors','projects','supports','opps','interactions','interest'].forEach(k=>db[k]=db[k]||[]);db.settings=db.settings||seed.settings;let page='dash',selectedProject=null;function save(){localStorage.setItem(K,JSON.stringify(db))}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}function total(d){return db.supports.filter(s=>s.donorId===d.id||s.donor===d.name).reduce((a,b)=>a+Number(b.amount||0),0)}function heat(d){return total(d)>=100000||db.interactions.some(i=>i.donorId===d.id)?'ساخن':total(d)>0?'دافئ':'بارد'}function nav(id,t){return`<button class="${page===id?'active':''}" onclick="page='${id}';layout()">${t}</button>`}function layout(){if(location.hash==='#public')return publicPage();$('#root').innerHTML=`<div class="app"><aside id="side" class="side"><div class="brand"><div class="logo">د</div><div><h1>مستشار الدعم الذكي</h1><p>منصة متكاملة مجانية</p></div></div><div class="nav">${nav('dash','الرئيسية')}${nav('radar','رادار الفرص المفتوحة')}${nav('donors','الداعمين')}${nav('projects','المشاريع')}${nav('support','الدعومات السابقة')}${nav('advisor','مستشار الدعم')}${nav('today','ماذا أفعل اليوم؟')}${nav('portfolio','محفظة المشاريع')}${nav('letters','الخطابات')}${nav('impact','تقارير الأثر')}${nav('settings','الإعدادات')}</div><div class="note">النسخة مجانية وتعمل من GitHub Pages. الرادار يحلل ويسجل الفرص ويفتح روابط بحث جاهزة؛ الزحف التلقائي الحقيقي يحتاج خادم/API لاحقًا.</div></aside><main class="main"><div class="top"><button class="mobile secondary" onclick="$('#side').classList.toggle('open')">☰ القائمة</button><div class="title"><h2 id="ttl"></h2><p id="sub"></p></div><div class="actions"><button class="secondary" onclick="backup()">تصدير نسخة</button><label class="btn secondary">استيراد نسخة<input hidden type="file" accept="application/json" onchange="importBackup(event)"></label></div></div><section id="content"></section></main></div>`;render()}function setTitle(t,s){$('#ttl').textContent=t;$('#sub').textContent=s||''}function render(){({dash,radar,donors,projects,support,advisor,today,portfolio,letters,impact,settings}[page]||dash)()}function dash(){setTitle('الرئيسية','نظرة تنفيذية على المنصة والفرص والمهام');let sum=db.supports.reduce((a,b)=>a+Number(b.amount||0),0),target=db.projects.reduce((a,b)=>a+Number(b.amount||0),0),covered=db.projects.reduce((a,b)=>a+Number(b.covered||0),0),open=db.opps.filter(o=>o.status!=='مغلقة').length;$('#content').innerHTML=`<div class="hero"><h3>منصة تنمية موارد متكاملة</h3><p>إدارة الداعمين، المشاريع، الدعومات السابقة، رادار الفرص المفتوحة، مستشار المطابقة، الخطابات، تقارير الأثر، ورابط محفظة مشاريع عام.</p><div class="quick"><button onclick="page='radar';layout()">رادار الفرص</button><button onclick="page='advisor';layout()">تشغيل المستشار</button><button onclick="page='portfolio';layout()">نسخ رابط المحفظة</button></div></div><br><div class="grid cards"><div class="card stat"><span>الدعم السابق</span><b>${money(sum)}</b></div><div class="card stat"><span>الفرص المفتوحة</span><b>${open}</b></div><div class="card stat"><span>الداعمين</span><b>${db.donors.length}</b></div><div class="card stat"><span>الفجوة التمويلية</span><b>${money(target-covered)}</b></div></div><br><div class="grid two"><div class="card white"><h3>مركز التوصيات</h3>${tasks().slice(0,8).map(x=>`<div class="card"><b>${esc(x)}</b><p class="small">جهّز رسالة أو خطاب وسجل نتيجة المتابعة.</p></div><br>`).join('')}</div><div class="card white"><h3>أقرب فرص مفتوحة</h3>${db.opps.filter(o=>o.status!=='مغلقة').slice(0,5).map(o=>`<p><b>${esc(o.title)}</b><br><span class="small">${esc(o.name)} — ${esc(o.deadline||'بدون موعد')} — ${oppScore(o)}%</span></p>`).join('')||'<div class="empty">لا توجد فرص</div>'}</div></div>`}function radar(){setTitle('رادار الفرص المفتوحة','رصد وتحليل الجهات المانحة المفتوحة');let open=db.opps.filter(o=>o.status!=='مغلقة').length;$('#content').innerHTML=`<div class="hero"><h3>رادار الجهات المفتوحة</h3><p>أضف فرصة دعم أو استخدم البحث الذكي لفتح روابط بحث جاهزة. بعد حفظ الفرصة يحللها النظام ويربطها بالمشاريع والداعمين.</p><div class="quick"><button onclick="oppForm()">إضافة فرصة</button><button onclick="smartScan()">بحث ذكي عن فرص</button><button onclick="addSamples()">توليد فرص نموذجية</button></div></div><br><div class="grid cards"><div class="card stat"><span>كل الفرص</span><b>${db.opps.length}</b></div><div class="card stat"><span>مفتوحة/متابعة</span><b>${open}</b></div><div class="card stat"><span>متوسط الملاءمة</span><b>${Math.round(avgOpp())}%</b></div><div class="card stat"><span>قابلة للتحويل</span><b>${db.opps.filter(o=>!db.donors.some(d=>d.name===o.name)).length}</b></div></div><br><div class="grid">${db.opps.map(oppCard).join('')||'<div class="empty">لا توجد فرص</div>'}</div>`}function oppCard(o){let badge=o.status==='مفتوحة'?'green':o.status==='مغلقة'?'red':'gold';return`<div class="card white radar"><div class="actions" style="justify-content:space-between"><div><h3>${esc(o.title)}</h3><p class="small">${esc(o.name)} — ${esc(o.sector||'')} — ${esc(o.city||'')}</p></div><div class="score">${oppScore(o)}%</div></div><p class="lead">${esc(o.notes||'')}</p><div class="actions"><span class="pill ${badge}">${esc(o.status)}</span><span class="pill blue">الموعد: ${esc(o.deadline||'غير محدد')}</span><span class="pill gold">النطاق: ${esc(o.amount||'غير محدد')}</span></div><br><div class="actions"><button onclick="oppLetter('${o.id}')">رسالة متابعة</button><button class="secondary" onclick="convertOpp('${o.id}')">تحويل لداعم</button><button class="secondary" onclick="oppForm('${o.id}')">تعديل</button></div></div>`}function oppForm(id=''){let o=db.opps.find(x=>x.id===id)||{};modal(`<h3>${id?'تعديل فرصة':'إضافة فرصة مفتوحة'}</h3><div class="form cols">${inp('name','اسم الجهة',o.name)}${inp('title','عنوان الفرصة',o.title)}${inp('sector','المجال / القطاع',o.sector)}${inp('city','المدينة',o.city)}${inp('status','الحالة',o.status||'مفتوحة')}${inp('deadline','آخر موعد',o.deadline,'date')}${inp('amount','نطاق الدعم',o.amount)}${inp('source','المصدر',o.source||'رصد يدوي')}${inp('url','رابط المصدر',o.url)}${txt('notes','ملاحظات وتحليل أولي',o.notes)}</div><br><button onclick="saveOpp('${id}')">حفظ الفرصة</button>`)}function saveOpp(id=''){let v=vals(),o=id?db.opps.find(x=>x.id===id):{id:uid(),createdAt:today()};Object.assign(o,v);if(!id)db.opps.unshift(o);save();closeM();radar();toast('تم حفظ الفرصة')}function smartScan(){let terms=['منح الجمعيات الخيرية السعودية فتح التقديم','مؤسسة مانحة تستقبل طلبات دعم الجمعيات','مسؤولية اجتماعية شركات دعم الجمعيات السعودية','منصة دعم مشاريع الجمعيات الخيرية','فرص دعم غير ربحي حائل'];modal(`<h3>بحث ذكي عن الجهات المفتوحة</h3><p class="lead">اضغط أي رابط لفتح بحث مباشر، ثم أضف الفرصة للرادار.</p><div class="grid">${terms.map(t=>`<div class="card white"><b>${esc(t)}</b><p class="small">يفتح بحث Google عن فرص حديثة.</p><button onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(t)}','_blank')">فتح البحث</button></div>`).join('')}</div>`)}function addSamples(){[{name:'مؤسسة دعم مجتمعي',title:'استقبال طلبات مشاريع تنموية',sector:'تنموي',city:'السعودية',status:'مفتوحة',deadline:'2026-10-01',amount:'100,000 - 300,000',source:'نموذج رادار',notes:'مناسبة لمشاريع الأثر القابل للقياس.'},{name:'شركة تجزئة وطنية',title:'برنامج شراكات مجتمعية موسمية',sector:'غذائي',city:'السعودية',status:'تحت المتابعة',deadline:'2026-09-20',amount:'دعم عيني / رعاية',source:'نموذج رادار',notes:'مناسبة للسلال الغذائية والحملات المشتركة.'},{name:'مبادرة تقنية للتعليم',title:'دعم برامج التمكين الرقمي',sector:'تقني',city:'الرياض',status:'مفتوحة',deadline:'2026-11-15',amount:'50,000 - 150,000',source:'نموذج رادار',notes:'مناسبة للتعليم والأجهزة والتدريب.'}].forEach(s=>db.opps.unshift({id:uid(),createdAt:today(),...s}));save();radar();toast('تمت إضافة فرص نموذجية')}function oppScore(o){let s=40;if(db.projects.some(p=>(o.sector||'').includes(p.cat)||(p.cat||'').includes(o.sector||'')))s+=25;if(o.status==='مفتوحة')s+=20;if(o.deadline){let d=(new Date(o.deadline)-new Date())/864e5;if(d>0&&d<45)s+=15}return Math.min(100,Math.max(20,Math.round(s)))}function avgOpp(){return db.opps.length?db.opps.reduce((a,o)=>a+oppScore(o),0)/db.opps.length:0}function convertOpp(id){let o=db.opps.find(x=>x.id===id);if(!db.donors.some(d=>d.name===o.name))db.donors.push({id:uid(),name:o.name,type:'جهة مانحة',sector:o.sector,city:o.city,contact:'',pref:o.notes,notes:'تم إنشاؤه من رادار الفرص'});save();toast('تم تحويل الفرصة إلى داعم')}function oppLetter(id){let o=db.opps.find(x=>x.id===id),p=bestProjectForOpp(o);modal(`<h3>رسالة متابعة للفرصة</h3><textarea>السلام عليكم ورحمة الله وبركاته\n\nسعادة/ ${o.name} المحترمين\n\nاطلعنا على فرصة "${o.title}"، ونرى أن مشروع "${p?.name||'أحد مشاريع الجمعية'}" يتوافق مع مجال الدعم لديكم، حيث يهدف إلى ${p?.summary||'تحقيق أثر اجتماعي قابل للقياس'}.\n\nنأمل إتاحة فرصة لتقديم ملف المشروع ودراسة إمكانية دعمه، ويسعدنا تزويدكم بكافة التفاصيل.\n\nوتفضلوا بقبول خالص الشكر والتقدير.\n${db.settings.org}</textarea>`)}function bestProjectForOpp(o){return db.projects.find(p=>(o.sector||'').includes(p.cat)||(p.cat||'').includes(o.sector||''))||db.projects[0]}function donors(){setTitle('الداعمين','إدارة العلاقات مع الجهات المانحة والشركات');$('#content').innerHTML=`<div class="section"><h3>قائمة الداعمين</h3><button onclick="donorForm()">إضافة داعم</button></div>${donorTable()}`}function donorTable(){return`<div class="table"><table><tr><th>الجهة</th><th>القطاع</th><th>العلاقة</th><th>إجمالي الدعم</th><th>أفضل مشروع</th><th>إجراء</th></tr>${db.donors.map(d=>`<tr><td><b>${esc(d مشاركة مشاريع الجمعية');let url=location.href.split('#')[0]+'#public';$('#content').innerHTML=`<div class="hero"><h3>رابط محفظة مشاريع الجمعية</h3><p>شارك هذا الرابط مع الجهات المانحة.</p><div class="quick"><button onclick="navigator.clipboard.writeText('${url}');toast('تم نسخ الرابط')">نسخ الرابط</button><button onclick="location.hash='public';layout()">معاينة الرابط</button><button onclick="downloadPortfolio()">تحميل HTML</button></div></div><br><div class="card white"><input value="${url}" readonly onclick="this.select()"></div><br><div class="grid three">${db.projects.map(projectCard).join('')}</div>`}function publicPage(){let s=db.settings;$('#root').innerHTML=`<div class="public"><section class="publicHero"><h1>${esc(s.org)}</h1><p>${esc(s.about)}</p><div class="grid cards"><div><b>${db.projects.length}</b><span> مشروع</span></div><div><b>${db.projects.reduce((a,b)=>a+Number(b.ben||0),0)}</b><span> مستفيد</span></div><div><b>${money(db.projects.reduce((a,b)=>a+Number(b.amount||0),0))}</b><span> فرص دعم</span></div></div><br><button onclick="location.hash='';layout()">دخول لوحة الجمعية</button></section><h2>مشاريع الجمعية المتاحة للدعم</h2><div class="grid three">${db.projects.map(p=>`<div class="project"><span class="pill gold">${esc(p.cat)}</span><h3>${esc(p.name)}</h3><p class="small">${esc(p.summary)}</p><b>${money(p.amount)}</b><p class="small">المستفيدون: ${p.ben||'-'} | ${esc(p.duration||'-')}</p><button onclick="interestForm('${p.id}')">أرغب بدعم هذا المشروع</button></div>`).join('')}</div></div>`}function letters(){setTitle('الخطابات','مولد خطابات رسمية');$('#content').innerHTML=`<div class="card white form cols">${select('ld','الداعم',db.donors)}${select('lp','المشروع',db.projects)}${inp('amount','المبلغ المقترح','')}${inp('kind','نوع الخطاب','طلب دعم')}<button onclick="generateLetter()">توليد الخطاب</button></div><br><textarea id="letterOut" style="min-height:330px"></textarea>`}function impact(){setTitle('تقارير الأثر','مولد تقرير أثر');$('#content').innerHTML=`<div class="card white form cols">${select('idn','الداعم',db.donors)}${select('ipr','المشروع',db.projects)}${inp('ben','عدد المستفيدين','')}${txt('done','ما تم تنفيذه','تم تنفيذ المشروع وفق الخطة المعتمدة.')}<button onclick="generateImpact()">توليد التقرير</button></div><br><textarea id="impactOut" style="min-height:330px"></textarea>`}function settings(){setTitle('الإعدادات','بيانات الجمعية والنسخ الاحتياطي');let s=db.settings;$('#content').innerHTML=`<div class="card white form cols">${inp('org','اسم الجمعية',s.org)}${inp('city','المدينة',s.city)}${inp('phone','الجوال',s.phone)}${inp('email','البريد',s.email)}${txt('about','نبذة الجمعية',s.about)}<button onclick="db.settings=vals();save();toast('تم الحفظ')">حفظ</button><button class="danger" onclick="resetAll()">إعادة تهيئة</button></div>`}function bestProject(d){return db.projects.find(p=>(d.sector+d.pref).includes(p.cat))||db.projects[0]}function scoreDonor(d,p){let s=40;if(!p)return s;if((d.sector+d.pref).includes(p.cat))s+=30;if(total(d)>0)s+=20;if(heat(d)==='ساخن')s+=10;return Math.min(100,s)}function rank(p){return db.donors.map(d=>{let score=scoreDonor(d,p),r=[];if((d.sector+d.pref).includes(p.cat))r.push('توافق واضح بين اهتمام الداعم وتصنيف المشروع');if(total(d)>0)r.push('لديه سجل دعم سابق');if(heat(d)==='ساخن')r.push('العلاقة ساخنة');if(!r.length)r.push('مناسب كبداية للتواصل');return{d,score,reason:r.join('، ')}}).sort((a,b)=>b.score-a.score)}function tasks(){let a=[];db.opps.filter(o=>o.status==='مفتوحة').forEach(o=>a.push(`استغلال فرصة مفتوحة: ${o.title} لدى ${o.name}`));db.donors.forEach(d=>{if(total(d)>0&&!db.supports.filter(s=>s.donorId===d.id||s.donor===d.name).some(s=>s.impact))a.push(`إرسال تقرير أثر إلى ${d.name}`);if(heat(d)==='ساخن')a.push(`متابعة عاجلة مع ${d.name}`)});db.projects.forEach(p=>{let rem=(p.amount||0)-(p.covered||0);if(rem>0)a.push(`البحث عن داعم لتغطية ${money(rem)} من مشروع ${p.name}`)});return a.slice(0,16)}function interactionForm(did,pid=''){let d=db.donors.find(x=>x.id===did);modal(`<h3>تسجيل تواصل مع ${esc(d.name)}</h3><div class="form cols">${inp('type','نوع التواصل','اتصال')}${inp('result','النتيجة','مهتم')}${inp('next','تاريخ المتابعة','', 'date')}${txt('note','ملاحظة','')}</div><br><button onclick="saveInteraction('${did}','${pid}')">حفظ</button>`)}function saveInteraction(did,pid=''){db.interactions.push({id:uid(),donorId:did,projectId:pid,...vals(),createdAt:new Date().toISOString()});save();closeM();toast('تم تسجيل التواصل')}function interestForm(pid){let p=db.projects.find(x=>x.id===pid);modal(`<h3>طلب اهتمام: ${esc(p.name)}</h3><div class="form cols">${inp('donor','اسم الجهة','')}${inp('person','اسم الشخص','')}${inp('phone','الجوال','')}${inp('email','البريد','')}${inp('type','نوع الدعم','نقدي')}${txt('msg','رسالة','')}</div><br><button onclick="saveInterest('${pid}')">إرسال</button>`)}function saveInterest(pid){db.interest.push({id:uid(),projectId:pid,...vals(),createdAt:new Date().toISOString()});save();closeM();toast('تم تسجيل الطلب')}function makeLetter(did,pid){page='letters';layout();setTimeout(()=>{$('#ld').value=did;if(pid)$('#lp').value=pid;generateLetter()},80)}function generateLetter(){let d=db.donors.find(x=>x.id===$('#ld').value),p=db.projects.find(x=>x.id===$('#lp').value),a=$('#amount').value||p.amount;$('#letterOut').value=`السلام عليكم ورحمة الله وبركاته\n\nسعادة/ ${d.name} المحترمين\n\nتحية طيبة، وبعد:\n\nيسر ${db.settings.org} أن تعرض عليكم فرصة دعم مشروع "${p.name}"، والذي يهدف إلى ${p.summary||'تحقيق أثر اجتماعي واضح'}، ويخدم ${p.ben||'عددًا من'} مستفيد.\n\nقيمة الدعم المقترحة: ${money(a)}.\n\nنأمل منكم دراسة فرصة الدعم، ويسعدنا تزويدكم بملف تفصيلي أو ترتيب اجتماع تعريفي.\n\nوتفضلوا بقبول خالص الشكر والتقدير.`}function generateImpact(){let d=db.donors.find(x=>x.id===$('#idn').value),p=db.projects.find(x=>x.id===$('#ipr').value);$('#impactOut').value=`تقرير أثر مختصر\n\nالداعم: ${d.name}\nالمشروع: ${p.name}\nعدد المستفيدين: ${$('#ben').value||p.ben||'-'}\n\nما تم تنفيذه:\n${$('#done').value}\n\nالأثر:\nساهم دعمكم في تعزيز استقرار المستفيدين ورفع جودة الخدمة المقدمة لهم.\n\nشكرًا لدعمكم وعطائكم.`}function importCsv(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let lines=r.result.split(/\r?\n/).filter(Boolean),n=0;lines.slice(1).forEach(line=>{let c=line.split(',');if(c[0]){let d=db.donors.find(x=>x.name===c[0]);if(!d){d={id:uid(),name:c[0],type:c[1]||'',sector:c[3]||'',city:'',pref:'',notes:'من CSV'};db.donors.push(d)}db.supports.push({id:uid(),donorId:d.id,donor:c[0],project:c[2]||'',cat:c[3]||'',amount:Number(c[4]||0),type:c[5]||'',date:c[6]||'',impact:(c[7]||'').includes('نعم')});n++}});save();support();toast('تم استيراد '+n+' سجل')};r.readAsText(f,'utf-8')}function csvTemplate(){download('قالب_الدعومات.csv','اسم الجهة,نوع الجهة,اسم المشروع,تصنيف المشروع,مبلغ الدعم,نوع الدعم,تاريخ الدعم,هل تم إرسال تقرير أثر,ملاحظات\nشركة مثال,شركة,كفالة تعليم,تعليمي,50000,نقدي,2026-01-01,نعم,ملاحظة')}function backup(){download('smart-donor-backup.json',JSON.stringify(db,null,2))}function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();layout();toast('تم استيراد النسخة')}catch{toast('ملف غير صالح')}};r.readAsText(f)}function downloadPortfolio(){download('portfolio.html','<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>محفظة المشاريع</title><body style="font-family:Arial;background:#f5f1e8;padding:24px"><h1>'+esc(db.settings.org)+'</h1>'+db.projects.map(p=>'<div style="background:white;border-radius:18px;padding:16px;margin:12px"><h2>'+esc(p.name)+'</h2><p>'+esc(p.summary)+'</p><b>'+money(p.amount)+'</b></div>').join('')+'</body></html>')}function download(n,c){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/plain;charset=utf-8'}));a.download=n;a.click()}function resetAll(){if(confirm('حذف البيانات المحلية؟')){localStorage.removeItem(K);db=JSON.parse(JSON.stringify(seed));save();layout()}}function modal(h){$('#modal').innerHTML=`<div class="box"><div class="box-head"><button class="secondary" onclick="closeM()">إغلاق</button></div>${h}</div>`;$('#modal').classList.add('show')}function closeM(){$('#modal').classList.remove('show')}function inp(id,l,v='',type='text'){return`<label>${l}<input id="${id}" type="${type}" value="${esc(v??'')}"></label>`}function txt(id,l,v=''){return`<label style="grid-column:1/-1">${l}<textarea id="${id}">${esc(v??'')}</textarea></label>`}function select(id,l,arr){return`<label>${l}<select id="${id}">${arr.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>`}function vals(){let o={};document.querySelectorAll('.box input,.box textarea,.box select,#content input,#content textarea,#content select').forEach(e=>o[e.id]=e.value);return o}window.addEventListener('hashchange',layout);layout();</script></body></html>
