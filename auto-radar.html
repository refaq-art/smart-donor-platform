<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الرادار التلقائي للفرص المفتوحة</title>
<style>
body{margin:0;background:#f7f2e9;color:#142b27;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#102522,#0f766e);color:white;border-radius:28px;padding:26px;margin-bottom:18px}.hero p{color:#dff4ef;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;border:1px solid #e4dac8;border-radius:20px;padding:16px;box-shadow:0 12px 30px rgba(0,0,0,.07)}.pill{display:inline-block;border-radius:999px;padding:6px 10px;background:#e7f5f2;color:#0f766e;font-size:12px;font-weight:800;margin:3px}.gold{background:#fff1d6;color:#8a5b00}.blue{background:#e8f1ff;color:#175cd3}.red{background:#fee4e2;color:#b42318}.small{color:#687773;font-size:13px;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}a,button{background:#0f766e;color:white;text-decoration:none;border:0;border-radius:12px;padding:10px 12px;font-weight:800}.secondary{background:white;color:#142b27;border:1px solid #e4dac8}.status{background:#fffaf1;border:1px solid #e4dac8;border-radius:18px;padding:14px;margin-bottom:16px}.hidden{display:none}@media(max-width:850px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<h1>الرادار التلقائي للفرص المفتوحة</h1>
<p>هذه الصفحة محمية بتسجيل الدخول عبر Firebase. لا تظهر الفرص إلا بعد تسجيل دخول جمعية معتمدة. النتائج تحتاج مراجعة بشرية قبل اعتمادها.</p>
<div class="actions"><a href="app.html?v=2">العودة للوحة الجمعية</a><a class="secondary" href="login-firebase.html?v=9">تسجيل الدخول</a></div>
</section>
<div class="status" id="status">جاري التحقق من تسجيل الدخول...</div>
<div class="grid hidden" id="list"></div>
</div>
<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
const app = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function render(data){
  document.getElementById('status').innerHTML='آخر تحديث: <b>'+esc(data.updatedAt||'غير معروف')+'</b><br><span class="small">المصدر: '+esc(data.source||'')+'</span>';
  var items=data.items||[];
  document.getElementById('list').classList.remove('hidden');
  if(!items.length){document.getElementById('list').innerHTML='<div class="card">لا توجد فرص مرصودة بعد.</div>';return}
  document.getElementById('list').innerHTML=items.map(function(o){
    return '<div class="card"><span class="pill">'+esc(o.status||'مرصودة')+'</span><span class="pill blue">'+esc(o.sector||'عام')+'</span><span class="pill gold">'+esc((o.score||0)+"%")+'</span><h3>'+esc(o.title)+'</h3><p class="small">'+esc(o.name||'')+' — '+esc(o.city||'')+'</p><p>'+esc(o.summary||'')+'</p><p class="small">المشروع المقترح: <b>'+esc(o.matchedProject||'')+'</b></p><div class="actions">'+(o.url?'<a target="_blank" href="'+esc(o.url)+'">فتح المصدر</a>':'')+'<button class="secondary" onclick="copyMsg(\''+esc(o.title).replace(/'/g,"\\'")+'\',\''+esc(o.matchedProject||'').replace(/'/g,"\\'")+'\')">نسخ رسالة متابعة</button></div></div>'
  }).join('');
}
window.copyMsg=function(title,project){
  var txt='السلام عليكم ورحمة الله وبركاته\n\nاطلعنا على فرصة: '+title+'، ونرى أن مشروع '+project+' قد يكون مناسبًا لمجال الدعم لديكم. يسعدنا تزويدكم بملف المشروع ودراسة إمكانية الدعم.\n\nوتفضلوا بقبول خالص الشكر والتقدير.';
  navigator.clipboard&&navigator.clipboard.writeText(txt);
  alert('تم تجهيز رسالة المتابعة');
}
onAuthStateChanged(auth,function(user){
  if(!user){
    location.href='login-firebase.html?v=9&next=auto-radar';
    return;
  }
  document.getElementById('status').textContent='تم التحقق من تسجيل الدخول، جاري تحميل الفرص...';
  fetch('./opportunities.json?v='+Date.now()).then(function(r){return r.json()}).then(render).catch(function(){document.getElementById('status').innerHTML='تعذر تحميل ملف الفرص.'});
});
</script>
</body></html>
